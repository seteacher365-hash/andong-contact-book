    function markDirty() {
      state.dirty = true;
      renderEditingControls();
    }

    function openPasswordModal(context = 'edit', individualId = '') {
      state.passwordContext = context;
      state.passwordIndividualId = individualId;
      const individual = context === 'individual';
      const person = individual ? getIndividualById(individualId) : null;
      els.passwordModal.classList.add('show');
      els.passwordTitle.textContent = individual
        ? `輸入「${person ? person.name : '此個案'}」的專屬密碼`
        : '輸入管理密碼';
      els.passwordHint.textContent = individual
        ? '帳號即為上方學生名稱。可輸入學生、導師或家長密碼；系統會依角色開啟可用功能。'
        : '瀏覽不需要密碼；只有修改與儲存資料時需要。';
      els.loginBtn.textContent = individual ? '開啟個案聯絡簿' : '進入編輯';
      els.passwordInput.placeholder = individual ? '學生／導師／家長密碼' : '管理密碼';
      els.passwordInput.value = '';
      els.passwordInput.type = 'password';
      els.passwordToggle.textContent = '顯示';
      setTimeout(() => els.passwordInput.focus(), 50);
    }

    function closePasswordModal() {
      els.passwordModal.classList.remove('show');
    }

    async function handleLogin(event) {
      event.preventDefault();
      const password = els.passwordInput.value;
      if (!password) return;
      els.loginBtn.disabled = true;
      els.loginBtn.textContent = '驗證中…';
      try {
        if (state.passwordContext === 'individual') {
          const person = getIndividualById(state.passwordIndividualId);
          if (!person) throw new Error('找不到此個案資料。');
          const result = await verifyIndividualPassword(person, password);
          if (!result || !result.ok) throw new Error('專屬密碼錯誤');
          state.unlockedIndividualId = person.id;
          state.selectedIndividualId = person.id;
          state.individualPassword = password;
          state.individualRole = result.role || 'viewer';
          state.feedbackDirty = false;
          state.feedbackDraft = '';
          state.commentEdit = null;
          state.pageMode = 'individuals';
          await loadWeek(state.weekStart);
        } else {
          const result = await callBackend('verifyPassword', password);
          if (!result || !result.ok) throw new Error('密碼錯誤');
          state.password = password;
          state.individualPassword = '';
          state.individualRole = 'viewer';
          state.editing = true;
          state.dirty = false;
          await loadWeek(state.weekStart);
        }
        closePasswordModal();
        renderAll();
        showToast(state.passwordContext === 'individual' ? `${getIndividualRoleLabel(state.individualRole)}模式已開啟` : '已進入編輯模式');
      } catch (error) {
        showToast(error.message || '密碼驗證失敗', true);
        els.passwordInput.select();
      } finally {
        els.loginBtn.disabled = false;
        els.loginBtn.textContent = state.passwordContext === 'individual' ? '開啟個案聯絡簿' : '進入編輯';
      }
    }

    async function verifyIndividualPassword(person, password) {
      return callBackend('verifyIndividualPassword', password, person.id, state.weekStart);
    }

    function adoptIndividualFeedbackResult(result) {
      state.data = normalizeClientData(result.data || state.data, state.weekStart);
      state.data.updatedAt = result.updatedAt || state.data.updatedAt;
      state.originalData = deepClone(state.data);
      state.originalConfig = deepClone(state.appConfig);
      persistAppConfig();
      state.weeks = Array.isArray(result.weeks) ? result.weeks : state.weeks;
    }

    async function saveIndividualFeedback() {
      const person = getIndividualById(state.unlockedIndividualId);
      const button = document.getElementById('saveIndividualFeedbackBtn');
      if (!person || !state.individualPassword || !state.feedbackDirty) return;
      if (state.commentEdit) {
        showToast('請先完成或取消目前的留言編輯', true);
        return;
      }
      if (button) {
        button.disabled = true;
        button.textContent = '儲存中…';
      }
      try {
        const role = state.individualRole;
        if (!['homeroom','parent'].includes(role)) throw new Error('目前帳號沒有留言權限。');
        const content = String(state.feedbackDraft || '').trim();
        if (!content) throw new Error('請先輸入留言內容。');
        const result = await callBackend(
          'saveIndividualFeedback', state.individualPassword, person.id, state.weekStart, role, content, 'create', ''
        );
        adoptIndividualFeedbackResult(result);
        state.feedbackDirty = false;
        state.feedbackDraft = '';
        state.commentEdit = null;
        renderAll();
        showToast(isCloudStorage() ? `${getIndividualRoleLabel(role)}留言已新增到雲端` : `${getIndividualRoleLabel(role)}留言已新增到此瀏覽器`);
      } catch (error) {
        console.error(error);
        showToast(error.message || '師長留言儲存失敗', true);
        if (button) {
          button.disabled = false;
          button.textContent = `新增${getIndividualRoleLabel(state.individualRole)}留言`;
        }
      }
    }

    async function changeOwnFeedbackPassword() {
      const person = getIndividualById(state.unlockedIndividualId);
      const role = state.individualRole;
      const input = document.getElementById('roleNewPassword');
      const button = document.getElementById('changeFeedbackPasswordBtn');
      const nextPassword = input ? input.value.trim() : '';
      if (!person || !['homeroom','parent'].includes(role)) return;
      if (nextPassword.length < 4) {
        showToast('新密碼至少需要 4 個字元', true);
        if (input) input.focus();
        return;
      }
      if (button) {
        button.disabled = true;
        button.textContent = '變更中…';
      }
      try {
        await callBackend('changeFeedbackPassword', state.individualPassword, person.id, role, nextPassword, state.weekStart);
        state.individualPassword = nextPassword;
        if (input) input.value = '';
        showToast(`${getIndividualRoleLabel(role)}密碼已更新`);
      } catch (error) {
        console.error(error);
        showToast(error.message || '密碼變更失敗', true);
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = '變更我的密碼';
        }
      }
    }

    async function saveCurrentWeek() {
      if (!state.editing || !state.dirty) return;
      els.saveBtn.disabled = true;
      els.saveBtn.textContent = '儲存中…';
      try {
        state.data.appConfig = deepClone(state.appConfig);
        const result = await callBackend('saveWeek', state.password, state.data);
        state.data = normalizeClientData(result.data || state.data, state.weekStart);
        state.data.updatedAt = result.updatedAt || state.data.updatedAt;
        state.originalData = deepClone(state.data);
        state.originalConfig = deepClone(state.appConfig);
        persistAppConfig();
        state.weeks = Array.isArray(result.weeks) ? result.weeks : state.weeks;
        state.dirty = false;
        renderAll();
        showToast(isCloudStorage() ? '本週資料已儲存到雲端' : '本週資料已儲存在此瀏覽器');
      } catch (error) {
        console.error(error);
        showToast(error.message || '儲存失敗', true);
      } finally {
        els.saveBtn.textContent = '儲存本週';
        renderEditingControls();
      }
    }

    function cancelChanges() {
      if (!state.dirty || confirm('確定放棄本次修改嗎？')) {
        state.data = deepClone(state.originalData);
        if (state.originalConfig) state.appConfig = deepClone(state.originalConfig);
        state.dirty = false;
        renderAll();
        showToast('已恢復到上次儲存內容');
      }
    }

    async function leaveEditing() {
      if ((state.dirty || state.settingsDirty) && !confirm('尚有未儲存的修改，確定離開編輯模式嗎？')) return;
      if (state.dirty) {
        state.data = deepClone(state.originalData);
        if (state.originalConfig) state.appConfig = deepClone(state.originalConfig);
      }
      state.editing = false;
      state.password = '';
      state.individualPassword = '';
      state.individualRole = 'viewer';
      state.dirty = false;
      state.settingsDirty = false;
      state.feedbackDirty = false;
      state.feedbackDraft = '';
      state.commentEdit = null;
      state.pageMode = 'individuals';
      state.unlockedIndividualId = '';
      if (els.utilityModal.classList.contains('show')) closeUtility(true);
      if (firebaseReady) await firebaseSignOutToPublic();
      else renderAll();
    }

    function setLoading(value) {
      state.loading = value;
      if (value) els.content.innerHTML = '<div class="loading"><div><div class="spinner"></div>正在讀取聯絡簿…</div></div>';
    }

    function dayHasContent(day, scope = 'all', privateView = false, scheduleEntries = []) {
      const viewDay = getStudentViewDay(day, scheduleEntries);
      if (!viewDay.enabled) return Boolean(viewDay.holidayNote);
      const general = viewDay.general || {};
      const special = viewDay.special || {};
      const common = viewDay.common || {};
      const chineseHasContent = [general.chineseLesson, general.chineseOther, general.chineseHomework].some(Boolean)
        || (general.chineseTopics || []).length;
      const mathHasContent = [general.mathUnit, general.mathContent, general.mathHomework].some(Boolean);
      const specialHasContent = [special.subject, special.otherCategory, special.content, special.homework].some(Boolean)
        || (special.categories || []).length;
      const commonHasContent = privateView && ([common.otherAssessment, common.points, common.note].some(Boolean)
        || (common.assessmentMethods || []).length);
      const selectedContent = scope === 'chinese' ? chineseHasContent
        : scope === 'math' ? mathHasContent
        : scope === 'special' ? specialHasContent
        : chineseHasContent || mathHasContent || specialHasContent || commonHasContent;
      return Boolean(day.holidayNote || selectedContent);
    }

    function pill(text, style = '') {
      return `<span class="pill ${style}">✓ ${escapeHtml(text)}</span>`;
    }

    function textValue(text, fallback = '') {
      return text
        ? `<div class="value">${escapeHtml(text)}</div>`
        : `<div class="value empty">${escapeHtml(fallback)}</div>`;
    }

    function weekdayName(index) {
      return ['星期一','星期二','星期三','星期四','星期五'][index] || '';
    }

    function weekRangeText(weekStart) {
      const start = parseISO(weekStart);
      const end = new Date(start);
      end.setDate(start.getDate() + 4);
      return `${start.getFullYear()}/${start.getMonth()+1}/${start.getDate()}－${end.getFullYear()}/${end.getMonth()+1}/${end.getDate()}`;
    }

    function currentMondayISO() {
      const today = new Date();
      const day = today.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      today.setHours(12,0,0,0);
      today.setDate(today.getDate() + diff);
      return toISO(today);
    }

    function initialWeekStart(term = getActiveTerm()) {
      const current = currentMondayISO();
      const start = term && term.startDate ? term.startDate : DEFAULT_TERM_START;
      const count = term && term.weekCount ? term.weekCount : DEFAULT_TERM_WEEK_COUNT;
      const last = addDaysISO(start, (count - 1) * 7);
      if (current < start) return start;
      if (current > last) return last;
      return current;
    }

    function addDaysISO(value, days) {
      const date = parseISO(value);
      date.setDate(date.getDate() + Number(days || 0));
      return toISO(date);
    }

    function getTermWeeks(term = getActiveTerm()) {
      const start = term && term.startDate ? term.startDate : DEFAULT_TERM_START;
      const count = term && term.weekCount ? term.weekCount : DEFAULT_TERM_WEEK_COUNT;
      return Array.from({ length: count }, (_, index) => ({
        number: index + 1,
        weekStart: addDaysISO(start, index * 7)
      }));
    }

    function getTermWeekNumber(weekStart, term = getActiveTerm()) {
      const target = parseISO(weekStartMonday(weekStart));
      const start = parseISO(term && term.startDate ? term.startDate : DEFAULT_TERM_START);
      const count = term && term.weekCount ? term.weekCount : DEFAULT_TERM_WEEK_COUNT;
      const difference = Math.round((target - start) / 86400000);
      const number = Math.floor(difference / 7) + 1;
      return difference % 7 === 0 && number >= 1 && number <= count ? number : 0;
    }

    function getTermEndDate(term = getActiveTerm()) {
      const start = term && term.startDate ? term.startDate : DEFAULT_TERM_START;
      const count = term && term.weekCount ? term.weekCount : DEFAULT_TERM_WEEK_COUNT;
      return addDaysISO(start, (count - 1) * 7 + 4);
    }

    function parseISO(text) {
      const [y,m,d] = String(text).split('-').map(Number);
      return new Date(y, m - 1, d, 12, 0, 0);
    }

    function toISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth()+1).padStart(2,'0');
      const d = String(date.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }

    function normalizeClientData(input, weekStart) {
      const base = createEmptyWeekClient(weekStart || initialWeekStart());
      const src = input && typeof input === 'object' ? input : {};
      const merged = deepMerge(base, src);
      merged.weekStart = weekStartMonday(merged.weekStart || weekStart || initialWeekStart());
      merged.className = '安東潛能班';
      const matchingTerm = findTermForWeek(merged.weekStart) || getActiveTerm();
      merged.weekLabel = String(getTermWeekNumber(merged.weekStart, matchingTerm) || '');
      merged.appConfig = deepClone(state.appConfig || createDefaultAppConfig());
      const monday = parseISO(merged.weekStart);
      merged.days = Array.from({length:5}, (_, index) => {
        const date = new Date(monday);
        date.setDate(monday.getDate()+index);
        const sourceDay = Array.isArray(src.days) && src.days[index] ? src.days[index] : {};
        const day = deepMerge(createEmptyDayClient(toISO(date)), sourceDay);
        day.date = toISO(date);
        day.teacherCourses = normalizeTeacherCourses(sourceDay.teacherCourses, sourceDay.general, sourceDay.special);
        delete day.common.participation;
        delete day.common.signatures;
        return day;
      });
      merged.groups = Array.isArray(src.groups) && src.groups.length ? src.groups : DEFAULT_GROUPS.map(group => ({...group}));
      merged.individuals = createRosterIndividuals(merged.weekStart, Array.isArray(src.individuals) ? src.individuals : []);
      return merged;
    }

    function weekStartMonday(value) {
      const date = parseISO(value);
      const day = date.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      date.setDate(date.getDate()+diff);
      return toISO(date);
    }

    function createEmptyWeekClient(weekStart) {
      const monday = parseISO(weekStartMonday(weekStart));
      return {
        version: 1,
        weekStart: toISO(monday),
        weekLabel: '',
        className: '安東潛能班',
        notice: '',
        groups: DEFAULT_GROUPS.map(group => ({...group})),
        days: Array.from({length:5}, (_, index) => {
          const d = new Date(monday); d.setDate(monday.getDate()+index);
          return createEmptyDayClient(toISO(d));
        }),
        comments: { specialTeacher:'', homeroom:'', parent:'' },
        individuals: createRosterIndividuals(toISO(monday), []),
        appConfig: deepClone(state.appConfig || createDefaultAppConfig()),
        updatedAt: ''
      };
    }

    function createEmptyDayClient(date) {
      return {
        date, enabled:true, holidayNote:'', generalEnabled:true, specialEnabled:false,
        general:{ chineseLesson:'', chineseTopics:[], chineseOther:'', chineseHomework:'', mathUnit:'', mathContent:'', mathHomework:'' },
        special:{ subject:'', categories:[], otherCategory:'', content:'', homework:'' },
        common:{ assessmentMethods:[], otherAssessment:'', points:'', note:'' },
        teacherCourses: Object.fromEntries(TEACHERS.map(teacher => [teacher.id, createEmptyTeacherCourseSet()])),
        scheduleCourses: {}
      };
    }

    function createEmptyTeacherCourseSet() {
      return {
        chinese: { lesson:'', topics:[], other:'', homework:'' },
        math: { unit:'', content:'', homework:'' },
        special: { subject:'', categories:[], otherCategory:'', content:'', homework:'' }
      };
    }

    function createEmptyTeacherAssignments(groupId = 'all') {
      const assignments = Object.fromEntries(TEACHERS.map(teacher => [teacher.id, { chinese:false, math:false, special:false }]));
      const scope = ['chinese','math','special'].includes(groupId) ? groupId : null;
      if (scope) assignments.mary[scope] = true;
      else ['chinese','math','special'].forEach(key => { assignments.mary[key] = true; });
      return assignments;
    }

    function createEmptyRecords(weekStart) {
      const monday = parseISO(weekStartMonday(weekStart || initialWeekStart()));
      return Array.from({length:5}, (_, index) => {
        const date = new Date(monday); date.setDate(monday.getDate()+index);
        return {
          date: toISO(date), performanceTags:[], learning:'', showLearning:true,
          homework:'', teacherObservation:'', showTeacherObservation:false
        };
      });
    }

    function createEmptyIndividual(id, name, groupId, weekStart, password = 'set') {
      const records = createEmptyRecords(weekStart);
      return {
        id: String(id || 'case-' + Date.now()),
        name: String(name || '個案'),
        groupId: String(groupId || 'all'),
        password: String(password == null ? 'set' : password),
        teacherAssignments: createEmptyTeacherAssignments(groupId),
        records,
        recordsByTeacher: Object.fromEntries(TEACHERS.map(teacher => [teacher.id, deepClone(records)])),
        comments: { specialTeacher:'', homeroom:'', parent:'' },
        commentsByTeacher: Object.fromEntries(TEACHERS.map(teacher => [teacher.id, { specialTeacher:'', homeroom:'', parent:'' }])),
        familyFeedback: { homeroom:'', parent:'', updatedAt:'' }
      };
    }

    function createRosterIndividuals(weekStart, existingIndividuals) {
      const existing = Array.isArray(existingIndividuals) ? existingIndividuals : [];
      const roster = getStudentRoster(true);
      const rosterIds = new Set(roster.map(student => student.id));
      const activePeople = roster.map((student, index) => {
        const source = existing.find(person => person && (person.id === student.id || normalizeStudentName(person.name) === student.name));
        const person = source
          ? normalizeIndividual(source, index, weekStart)
          : createEmptyIndividual(student.id, student.name, 'all', weekStart, student.password);
        person.id = student.id;
        person.name = student.name;
        const sourcePassword = source && source.password != null ? String(source.password) : '';
        const configIsAuthoritative = Boolean(state.appConfig && state.appConfig.updatedAt);
        person.password = configIsAuthoritative ? String(student.password || '') : (sourcePassword || String(student.password || ''));
        if (!configIsAuthoritative && sourcePassword) student.password = sourcePassword;
        person.groupId = 'all';
        if (!source) person.teacherAssignments = Object.fromEntries(TEACHERS.map(teacher => [teacher.id, { chinese:false, math:false, special:false }]));
        TEACHERS.forEach(teacher => {
          if (!person.teacherAssignments[teacher.id]) person.teacherAssignments[teacher.id] = { chinese:false, math:false, special:false };
        });
        getStudentSchedule(student.name).forEach(entry => {
          const teacherId = entry.teacherId || 'mary';
          if (person.teacherAssignments[teacherId]) person.teacherAssignments[teacherId][entry.scope] = true;
        });
        person.active = student.active !== false;
        return person;
      });
      const archived = existing
        .filter(person => person && !rosterIds.has(person.id))
        .map((person, index) => ({ ...normalizeIndividual(person, roster.length + index, weekStart), active:false }));
      return [...activePeople, ...archived];
    }

    function normalizeStudentName(value) {
      return String(value || '').replace(/\s+/g, '').trim();
    }

    function normalizeIndividual(input, index, weekStart) {
      const src = input && typeof input === 'object' ? input : {};
      const base = createEmptyIndividual('case-' + (index + 1), '個案 ' + (index + 1), 'all', weekStart);
      const merged = deepMerge(base, src);
      const sourceRecords = Array.isArray(src.records) ? src.records : [];
      merged.teacherAssignments = normalizeTeacherAssignments(src.teacherAssignments, merged.groupId, src.teacherId);
      merged.recordsByTeacher = normalizeTeacherRecords(src.recordsByTeacher, sourceRecords, weekStart);
      merged.commentsByTeacher = normalizeTeacherComments(src.commentsByTeacher, src.comments);
      const hasFamilyFeedback = src.familyFeedback && typeof src.familyFeedback === 'object' && !Array.isArray(src.familyFeedback);
      if (hasFamilyFeedback) {
        merged.familyFeedback = deepMerge({ homeroom:'', parent:'', updatedAt:'' }, src.familyFeedback);
      } else {
        const legacyHomeroom = TEACHERS.map(teacher => merged.commentsByTeacher[teacher.id] && merged.commentsByTeacher[teacher.id].homeroom).find(Boolean)
          || (src.comments && src.comments.homeroom) || '';
        const legacyParent = TEACHERS.map(teacher => merged.commentsByTeacher[teacher.id] && merged.commentsByTeacher[teacher.id].parent).find(Boolean)
          || (src.comments && src.comments.parent) || '';
        merged.familyFeedback = { homeroom:String(legacyHomeroom || ''), parent:String(legacyParent || ''), updatedAt:'' };
      }
      merged.records = deepClone(merged.recordsByTeacher.mary || createEmptyRecords(weekStart));
      merged.comments = deepClone(merged.commentsByTeacher.mary || { specialTeacher:'', homeroom:'', parent:'' });
      return merged;
    }

    function normalizeTeacherAssignments(source, groupId, legacyTeacherId) {
      const assignments = createEmptyTeacherAssignments(groupId);
      let found = false;
      if (source && typeof source === 'object' && !Array.isArray(source)) {
        TEACHERS.forEach(teacher => {
          const item = source[teacher.id] || (teacher.id === 'mary' ? source.fu : null);
          if (!item || typeof item !== 'object') return;
          ['chinese','math','special'].forEach(scope => {
            if (scope in item) {
              assignments[teacher.id][scope] = Boolean(item[scope]);
              found = true;
            }
          });
        });
      } else if (Array.isArray(source)) {
        source.forEach(item => {
          const teacherId = item && item.teacherId;
          const scope = item && item.scope;
          if (assignments[teacherId] && ['chinese','math','special'].includes(scope)) {
            assignments[teacherId][scope] = true;
            found = true;
          }
        });
      }
      const normalizedLegacyTeacherId = legacyTeacherId === 'fu' ? 'mary' : legacyTeacherId;
      if (!found && normalizedLegacyTeacherId && assignments[normalizedLegacyTeacherId]) {
        Object.keys(assignments).forEach(id => { assignments[id] = { chinese:false, math:false, special:false }; });
        const scope = ['chinese','math','special'].includes(groupId) ? groupId : null;
        ['chinese','math','special'].forEach(key => { assignments[normalizedLegacyTeacherId][key] = scope ? key === scope : true; });
      }
      return assignments;
    }

    function normalizeTeacherRecords(source, legacyRecords, weekStart) {
      const recordsByTeacher = {};
      TEACHERS.forEach(teacher => {
        const raw = source && Array.isArray(source[teacher.id])
          ? source[teacher.id]
          : teacher.id === 'mary' && source && Array.isArray(source.fu)
            ? source.fu
            : teacher.id === 'mary' ? legacyRecords : [];
        const blank = createEmptyRecords(weekStart);
        recordsByTeacher[teacher.id] = blank.map((record, index) => {
          const sourceRecord = raw[index] && typeof raw[index] === 'object' ? raw[index] : {};
          const merged = deepMerge(record, sourceRecord);
          if (!merged.teacherObservation && sourceRecord.note) merged.teacherObservation = String(sourceRecord.note);
          if (!Object.prototype.hasOwnProperty.call(sourceRecord, 'showLearning') || (!sourceRecord.learning && sourceRecord.showLearning === false)) merged.showLearning = true;
          if (!Object.prototype.hasOwnProperty.call(sourceRecord, 'showTeacherObservation') && sourceRecord.note) merged.showTeacherObservation = true;
          merged.performanceTags = uniqueValues((Array.isArray(merged.performanceTags) ? merged.performanceTags : []).map(value => value === '專心參與' ? '上課專心' : value));
          merged.showLearning = Boolean(merged.showLearning);
          merged.showTeacherObservation = Boolean(merged.showTeacherObservation);
          delete merged.note;
          return merged;
        });
      });
      return recordsByTeacher;
    }

    function normalizeTeacherComments(source, legacyComments) {
      const commentsByTeacher = {};
      TEACHERS.forEach(teacher => {
        const raw = source && source[teacher.id] && typeof source[teacher.id] === 'object'
          ? source[teacher.id]
          : teacher.id === 'mary' && source && source.fu && typeof source.fu === 'object'
            ? source.fu
            : teacher.id === 'mary' ? legacyComments : null;
        commentsByTeacher[teacher.id] = deepMerge({ specialTeacher:'', homeroom:'', parent:'' }, raw || {});
      });
      return commentsByTeacher;
    }

    function normalizeTeacherCourses(source, legacyGeneral, legacySpecial) {
      const courses = Object.fromEntries(TEACHERS.map(teacher => [teacher.id, createEmptyTeacherCourseSet()]));
      if (source && typeof source === 'object') {
        TEACHERS.forEach(teacher => {
          const item = source[teacher.id] || (teacher.id === 'mary' ? source.fu : null);
          if (item && typeof item === 'object') courses[teacher.id] = deepMerge(courses[teacher.id], item);
        });
      }
      const hasSource = TEACHERS.some(teacher => {
        const item = courses[teacher.id];
        return hasChineseCourseContent(item.chinese) || hasMathCourseContent(item.math) || hasSpecialCourseContent(item.special);
      });
      if (!hasSource && (legacyGeneral || legacySpecial)) {
        const general = legacyGeneral || {};
        const special = legacySpecial || {};
        courses.mary.chinese = {
          lesson: general.chineseLesson || '', topics: Array.isArray(general.chineseTopics) ? [...general.chineseTopics] : [], other: general.chineseOther || '', homework: general.chineseHomework || ''
        };
        courses.mary.math = { unit: general.mathUnit || '', content: general.mathContent || '', homework: general.mathHomework || '' };
        courses.mary.special = {
          subject: special.subject || '', categories: Array.isArray(special.categories) ? [...special.categories] : [], otherCategory: special.otherCategory || '', content: special.content || '', homework: special.homework || ''
        };
      }
      return courses;
    }

    function deepMerge(target, source) {
      if (!source || typeof source !== 'object') return target;
      Object.keys(source).forEach(key => {
        const value = source[key];
        if (Array.isArray(value)) target[key] = [...value];
        else if (value && typeof value === 'object') target[key] = deepMerge(target[key] && typeof target[key] === 'object' ? target[key] : {}, value);
        else target[key] = value;
      });
      return target;
    }

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function getPath(object, path) {
      return path.split('.').reduce((current, key) => current == null ? undefined : current[key], object);
    }

    function setPath(object, path, value) {
      const keys = path.split('.');
      const last = keys.pop();
      const parent = keys.reduce((current, key) => current[key], object);
      parent[last] = value;
    }

    function shouldUseLocalPreview() {
      if (hasServer()) return false;
      try {
        const params = new URLSearchParams(window.location.search);
        return window.location.protocol === 'file:' || params.get('local') === '1';
      } catch (error) {
        return true;
      }
    }

    function isCloudStorage() {
      return state.storageMode === 'cloud' || state.storageMode === 'firebase';
    }

    async function initializeFirebaseClient() {
      if (hasServer() || shouldUseLocalPreview()) {
        state.storageMode = hasServer() ? 'cloud' : 'local';
        return false;
      }
      try {
        const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_SDK_VERSION + '/';
        const modules = await Promise.all([
          import(base + 'firebase-app.js'),
          import(base + 'firebase-auth.js'),
          import(base + 'firebase-firestore.js')
        ]);
        const appModule = modules[0];
        const authModule = modules[1];
        const storeModule = modules[2];
        firebaseApi = {
          initializeApp: appModule.initializeApp,
          getAuth: authModule.getAuth,
          signInWithEmailAndPassword: authModule.signInWithEmailAndPassword,
          signOut: authModule.signOut,
          updatePassword: authModule.updatePassword,
          setPersistence: authModule.setPersistence,
          browserSessionPersistence: authModule.browserSessionPersistence,
          getFirestore: storeModule.getFirestore,
          doc: storeModule.doc,
          collection: storeModule.collection,
          getDoc: storeModule.getDoc,
          getDocs: storeModule.getDocs,
          setDoc: storeModule.setDoc,
          deleteDoc: storeModule.deleteDoc,
          writeBatch: storeModule.writeBatch,
          runTransaction: storeModule.runTransaction,
          query: storeModule.query,
          orderBy: storeModule.orderBy,
          where: storeModule.where
        };
        firebaseApp = firebaseApi.initializeApp(FIREBASE_CONFIG);
        firebaseAuth = firebaseApi.getAuth(firebaseApp);
        firebaseDb = firebaseApi.getFirestore(firebaseApp);
        await firebaseApi.setPersistence(firebaseAuth, firebaseApi.browserSessionPersistence);
        if (firebaseAuth.currentUser) await firebaseApi.signOut(firebaseAuth);
        firebaseReady = true;
        firebaseInitError = null;
        state.storageMode = 'firebase';
        state.cloudRole = 'public';
        state.appConfig = normalizeAppConfig(sanitizeAppConfigForPublic(state.appConfig));
        persistAppConfig();
        return true;
      } catch (error) {
        firebaseReady = false;
        firebaseInitError = error;
        state.storageMode = 'firebase-error';
        console.error('Firebase 初始化失敗', error);
        return false;
      }
    }

    function sanitizeAppConfigForPublic(config) {
      const clean = deepClone(config || createDefaultAppConfig());
      clean.students = (clean.students || []).map(student => ({
        id: String(student.id || ''),
        name: String(student.name || ''),
        active: student.active !== false
      }));
      return clean;
    }

    function sanitizeWeekForPublic(input) {
      const clean = deepClone(input || {});
      delete clean.individuals;
      delete clean.comments;
      clean.appConfig = sanitizeAppConfigForPublic(clean.appConfig || state.appConfig);
      clean.days = (clean.days || []).map(day => {
        const item = deepClone(day || {});
        item.common = { assessmentMethods:[], otherAssessment:'', points:'', note:'' };
        return item;
      });
      return clean;
    }

    function sanitizeIndividualForStudent(person) {
      const clean = deepClone(person || {});
      delete clean.password;
      delete clean.teacherAssignments;
      if (clean.commentsByTeacher && typeof clean.commentsByTeacher === 'object') {
        Object.keys(clean.commentsByTeacher).forEach(teacherId => {
          const item = clean.commentsByTeacher[teacherId] || {};
          item.homeroom = '';
          item.parent = '';
          clean.commentsByTeacher[teacherId] = item;
        });
      }
      clean.comments = clean.comments || {};
      clean.comments.homeroom = '';
      clean.comments.parent = '';
      clean.familyFeedback = { homeroom:'', parent:'', updatedAt:'' };
      return clean;
    }

    function firebaseWeekDocumentId(studentId, weekStart) {
      return String(studentId || '').replace(/\//g, '-') + '__' + weekStartMonday(weekStart);
    }

    function firebaseAccountEmail(studentId, role, version) {
      const safeStudent = String(studentId || 'student').toLowerCase().replace(/[^a-z0-9-]/g, '-');
      const safeRole = ['viewer','homeroom','parent'].includes(role) ? role : 'viewer';
      return safeRole + '.' + safeStudent + '.v' + String(version) + '@' + FIREBASE_ACCOUNT_DOMAIN;
    }

    async function firebaseActualPassword(email, visiblePassword) {
      const digest = await hashSecret(
        FIREBASE_PASSWORD_NAMESPACE + '|' + String(email || '').toLowerCase() + '|' + String(visiblePassword || '')
      );
      return 'Cb!' + digest.replace(/^[^:]+:/, '');
    }

    function firebaseTimestamp() {
      return new Intl.DateTimeFormat('zh-TW', {
        dateStyle:'short', timeStyle:'medium', hour12:false
      }).format(new Date());
    }

    function firebaseAuthErrorIsCredential(error) {
      const code = String(error && error.code || '');
      return [
        'auth/invalid-credential',
        'auth/invalid-login-credentials',
        'auth/user-not-found',
        'auth/wrong-password',
        'auth/user-disabled'
      ].includes(code);
    }

    async function firebaseCurrentProfile() {
      const user = firebaseAuth && firebaseAuth.currentUser;
      if (!user || !user.email) return { role:'public', studentId:'', active:true, email:'' };
      const email = String(user.email).toLowerCase();
      if (email === FIREBASE_TEACHER_EMAIL.toLowerCase()) {
        return { role:'teacher', studentId:'', active:true, email };
      }
      const reference = firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.accountAccess, email);
      const snapshot = await firebaseApi.getDoc(reference);
      if (!snapshot.exists()) throw new Error('此登入帳號尚未取得聯絡簿權限。');
      const profile = snapshot.data() || {};
      if (profile.active !== true) throw new Error('此登入帳號已停用，請洽特教教師。');
      return {
        role: String(profile.role || 'viewer'),
        studentId: String(profile.studentId || ''),
        active: true,
        email
      };
    }

    async function firebaseReadConfig(privateConfig) {
      const collectionName = privateConfig ? FIREBASE_COLLECTIONS.privateConfig : FIREBASE_COLLECTIONS.publicConfig;
      const snapshot = await firebaseApi.getDoc(firebaseApi.doc(firebaseDb, collectionName, 'current'));
      const fallback = privateConfig ? createDefaultAppConfig() : sanitizeAppConfigForPublic(createDefaultAppConfig());
      return normalizeAppConfig(snapshot.exists() ? snapshot.data() : fallback);
    }

    function firebaseApplyFamilyFeedback(person, comment) {
      if (!person) return;
      const source = comment && typeof comment === 'object' ? comment : {};
      person.familyFeedback = {
        homeroom: String(source.homeroom || ''),
        parent: String(source.parent || ''),
        updatedAt: String(source.updatedAt || '')
      };
    }

    async function firebaseGetWeekData(weekStart) {
      const target = weekStartMonday(weekStart || initialWeekStart());
      const profile = await firebaseCurrentProfile();
      state.cloudRole = profile.role;
      const isTeacher = profile.role === 'teacher';
      const config = await firebaseReadConfig(isTeacher);
      const publicReference = firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.publicWeeks, target);
      const publicSnapshot = await firebaseApi.getDoc(publicReference);
      let data = publicSnapshot.exists() ? publicSnapshot.data() : createEmptyWeekClient(target);

      if (isTeacher) {
        const privateSnapshot = await firebaseApi.getDoc(firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.privateWeeks, target));
        if (privateSnapshot.exists()) data = privateSnapshot.data();
      } else if (profile.studentId) {
        const studentSnapshot = await firebaseApi.getDoc(
          firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.studentWeeks, firebaseWeekDocumentId(profile.studentId, target))
        );
        if (studentSnapshot.exists() && studentSnapshot.data().individual) {
          data = deepClone(data);
          data.individuals = [studentSnapshot.data().individual];
        }
      }

      data = deepClone(data || createEmptyWeekClient(target));
      data.weekStart = target;
      data.appConfig = deepClone(config);

      if (isTeacher) {
        const people = Array.isArray(data.individuals) ? data.individuals : [];
        await Promise.all(people.map(async person => {
          const commentSnapshot = await firebaseApi.getDoc(
            firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.comments, firebaseWeekDocumentId(person.id, target))
          );
          if (commentSnapshot.exists()) firebaseApplyFamilyFeedback(person, commentSnapshot.data());
        }));
      } else if (profile.studentId) {
        const people = Array.isArray(data.individuals) ? data.individuals : [];
        const person = people.find(item => item.id === profile.studentId);
        const commentSnapshot = await firebaseApi.getDoc(
          firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.comments, firebaseWeekDocumentId(profile.studentId, target))
        );
        if (commentSnapshot.exists()) firebaseApplyFamilyFeedback(person, commentSnapshot.data());
      }
      return data;
    }

    async function firebaseListWeeks() {
      const reference = firebaseApi.collection(firebaseDb, FIREBASE_COLLECTIONS.publicWeeks);
      const snapshot = await firebaseApi.getDocs(firebaseApi.query(reference, firebaseApi.orderBy('weekStart', 'desc')));
      return snapshot.docs.map(item => {
        const data = item.data() || {};
        return { weekStart:String(data.weekStart || item.id), updatedAt:String(data.updatedAt || '') };
      });
    }

    async function firebaseTeacherLogin(visiblePassword) {
      if (!firebaseReady) throw new Error('Firebase 尚未連線。');
      if (firebaseAuth.currentUser) await firebaseApi.signOut(firebaseAuth);
      const actualPassword = await firebaseActualPassword(FIREBASE_TEACHER_EMAIL, visiblePassword);
      try {
        await firebaseApi.signInWithEmailAndPassword(firebaseAuth, FIREBASE_TEACHER_EMAIL, actualPassword);
        state.cloudRole = 'teacher';
        return { ok:true };
      } catch (error) {
        if (firebaseAuthErrorIsCredential(error)) return { ok:false };
        throw error;
      }
    }

    async function firebaseIndividualLogin(visiblePassword, studentId) {
      if (!firebaseReady) throw new Error('Firebase 尚未連線。');
      if (firebaseAuth.currentUser) await firebaseApi.signOut(firebaseAuth);
      const directorySnapshot = await firebaseApi.getDoc(
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.loginDirectory, studentId)
      );
      if (!directorySnapshot.exists()) return { ok:false };
      const directory = directorySnapshot.data() || {};
      if (directory.active !== true) throw new Error('此學生帳號已停用，請洽特教教師。');
      const accounts = directory.accounts || {};
      for (const role of ['viewer','homeroom','parent']) {
        const account = accounts[role];
        if (!account || !account.email) continue;
        const actualPassword = await firebaseActualPassword(account.email, visiblePassword);
        try {
          await firebaseApi.signInWithEmailAndPassword(firebaseAuth, account.email, actualPassword);
          const profile = await firebaseCurrentProfile();
          if (profile.studentId === studentId && profile.role === role) {
            state.cloudRole = role;
            return { ok:true, role };
          }
          await firebaseApi.signOut(firebaseAuth);
        } catch (error) {
          if (firebaseAuth.currentUser) await firebaseApi.signOut(firebaseAuth);
          if (!firebaseAuthErrorIsCredential(error)) {
            const message = String(error && error.message || '');
            if (!message.includes('已停用') && !message.includes('權限')) throw error;
          }
        }
      }
      state.cloudRole = 'public';
      return { ok:false };
    }

    async function firebaseCreateAuthAccount(email, visiblePassword) {
      const response = await fetch(
        'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + encodeURIComponent(FIREBASE_CONFIG.apiKey),
        {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body:JSON.stringify({
            email,
            password:await firebaseActualPassword(email, visiblePassword),
            returnSecureToken:true
          })
        }
      );
      const payload = await response.json();
      if (response.ok) return { created:true };
      const code = String(payload && payload.error && payload.error.message || 'AUTH_ACCOUNT_CREATE_FAILED');
      if (code.includes('EMAIL_EXISTS')) return { created:false, exists:true };
      throw new Error('建立登入帳號失敗：' + code);
    }

    async function firebaseProvisionRoleAccount(studentId, role, visiblePassword, previousVersion) {
      let version = Math.max(Date.now(), Number(previousVersion || 0) + 1);
      for (let attempt = 0; attempt < 5; attempt += 1) {
        const email = firebaseAccountEmail(studentId, role, version);
        const result = await firebaseCreateAuthAccount(email, visiblePassword);
        if (result.created) return { email, version };
        version += 1;
      }
      throw new Error('無法建立新的登入版本，請稍後再試。');
    }

    function firebaseDefaultRolePassword(student, role) {
      const base = String(student && student.password || '');
      if (role === 'homeroom') return 'T' + base;
      if (role === 'parent') return 'P' + base;
      return base;
    }

    function firebaseQueueAccess(batch, account, student, role, active, updatedAt) {
      if (!account || !account.email) return;
      batch.set(
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.accountAccess, String(account.email).toLowerCase()),
        {
          email:String(account.email).toLowerCase(),
          studentId:String(student.id || ''),
          studentName:String(student.name || ''),
          role,
          version:Number(account.version || 0),
          active:Boolean(active),
          updatedAt
        },
        { merge:true }
      );
    }

    async function firebaseSyncStudentAccounts(newConfig, oldConfig, batch, updatedAt) {
      const oldStudents = new Map((oldConfig && oldConfig.students || []).map(student => [student.id, student]));
      const currentIds = new Set((newConfig.students || []).map(student => student.id));

      for (const student of (newConfig.students || [])) {
        const directoryReference = firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.loginDirectory, student.id);
        const directorySnapshot = await firebaseApi.getDoc(directoryReference);
        const existing = directorySnapshot.exists() ? directorySnapshot.data() : {};
        const directory = {
          studentId:student.id,
          name:student.name,
          active:student.active !== false,
          accounts:deepClone(existing.accounts || {}),
          updatedAt
        };
        const oldStudent = oldStudents.get(student.id);
        const viewerPasswordChanged = Boolean(oldStudent)
          && String(oldStudent.password || '') !== String(student.password || '');

        if (student.active !== false) {
          for (const role of ['viewer','homeroom','parent']) {
            const current = directory.accounts[role];
            const needsNewAccount = !current || !current.email || (role === 'viewer' && viewerPasswordChanged);
            if (needsNewAccount) {
              const visiblePassword = firebaseDefaultRolePassword(student, role);
              if (!visiblePassword) throw new Error('請先設定「' + student.name + '」的登入密碼。');
              const next = await firebaseProvisionRoleAccount(student.id, role, visiblePassword, current && current.version);
              if (current && current.email) firebaseQueueAccess(batch, current, student, role, false, updatedAt);
              directory.accounts[role] = next;
            }
            firebaseQueueAccess(batch, directory.accounts[role], student, role, true, updatedAt);
          }
        } else {
          for (const role of ['viewer','homeroom','parent']) {
            firebaseQueueAccess(batch, directory.accounts[role], student, role, false, updatedAt);
          }
        }
        batch.set(directoryReference, directory, { merge:true });
      }

      for (const oldStudent of (oldConfig && oldConfig.students || [])) {
        if (currentIds.has(oldStudent.id)) continue;
        const reference = firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.loginDirectory, oldStudent.id);
        const snapshot = await firebaseApi.getDoc(reference);
        if (!snapshot.exists()) continue;
        const directory = snapshot.data() || {};
        directory.active = false;
        directory.updatedAt = updatedAt;
        batch.set(reference, directory, { merge:true });
        for (const role of ['viewer','homeroom','parent']) {
          firebaseQueueAccess(batch, directory.accounts && directory.accounts[role], oldStudent, role, false, updatedAt);
        }
      }
    }

    async function firebaseSaveWeek(rawData) {
      const profile = await firebaseCurrentProfile();
      if (profile.role !== 'teacher') throw new Error('教師登入已失效，請重新登入。');
      const target = weekStartMonday(rawData && rawData.weekStart || state.weekStart);
      const updatedAt = firebaseTimestamp();
      const privateConfigSnapshot = await firebaseApi.getDoc(
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.privateConfig, 'current')
      );
      const oldConfig = privateConfigSnapshot.exists()
        ? normalizeAppConfig(privateConfigSnapshot.data())
        : createDefaultAppConfig();
      const nextConfig = normalizeAppConfig(rawData && rawData.appConfig || state.appConfig);
      const data = normalizeClientData(rawData, target);
      data.appConfig = deepClone(nextConfig);
      data.updatedAt = updatedAt;

      const commentSnapshots = new Map();
      await Promise.all((data.individuals || []).map(async person => {
        const reference = firebaseApi.doc(
          firebaseDb, FIREBASE_COLLECTIONS.comments, firebaseWeekDocumentId(person.id, target)
        );
        const snapshot = await firebaseApi.getDoc(reference);
        commentSnapshots.set(person.id, snapshot);
        if (snapshot.exists()) firebaseApplyFamilyFeedback(person, snapshot.data());
      }));

      const batch = firebaseApi.writeBatch(firebaseDb);
      await firebaseSyncStudentAccounts(nextConfig, oldConfig, batch, updatedAt);
      batch.set(
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.privateConfig, 'current'),
        deepClone(nextConfig)
      );
      batch.set(
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.publicConfig, 'current'),
        sanitizeAppConfigForPublic(nextConfig)
      );
      batch.set(
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.privateWeeks, target),
        deepClone(data)
      );
      batch.set(
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.publicWeeks, target),
        sanitizeWeekForPublic(data)
      );

      const activeIds = new Set((nextConfig.students || []).filter(student => student.active !== false).map(student => student.id));
      for (const person of (data.individuals || [])) {
        if (!activeIds.has(person.id)) continue;
        const documentId = firebaseWeekDocumentId(person.id, target);
        batch.set(
          firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.studentWeeks, documentId),
          {
            studentId:person.id,
            weekStart:target,
            individual:sanitizeIndividualForStudent(person),
            updatedAt
          }
        );
        const commentSnapshot = commentSnapshots.get(person.id);
        if (!commentSnapshot || !commentSnapshot.exists()) {
          const family = getFamilyFeedback(person);
          batch.set(
            firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.comments, documentId),
            {
              studentId:person.id,
              weekStart:target,
              homeroom:family.homeroom,
              parent:family.parent,
              updatedAt:family.updatedAt || updatedAt
            }
          );
        }
      }
      await batch.commit();
      state.cloudRole = 'teacher';
      return { ok:true, updatedAt, weeks:await firebaseListWeeks(), data };
    }

    async function firebaseSaveIndividualFeedback(studentId, weekStart, role, value, action = 'create', targetId = '') {
      const profile = await firebaseCurrentProfile();
      if (profile.studentId !== studentId || profile.role !== role || !['homeroom','parent'].includes(role)) {
        throw new Error('目前帳號沒有此留言權限。');
      }
      const target = weekStartMonday(weekStart);
      const updatedAt = firebaseTimestamp();
      const reference = firebaseApi.doc(
        firebaseDb, FIREBASE_COLLECTIONS.comments, firebaseWeekDocumentId(studentId, target)
      );
      await firebaseApi.runTransaction(firebaseDb, async transaction => {
        const existing = await transaction.get(reference);
        const current = existing.exists() ? String(existing.data()[role] || '') : '';
        const nextValue = appendCommentMutation(
          current,
          { role, author:getIndividualRoleLabel(role), teacherId:'' },
          action,
          String(targetId || ''),
          String(value || '')
        );
        const payload = existing.exists()
          ? { [role]:nextValue, updatedAt }
          : {
              studentId,
              weekStart:target,
              homeroom:role === 'homeroom' ? nextValue : '',
              parent:role === 'parent' ? nextValue : '',
              updatedAt
            };
        transaction.set(reference, payload, { merge:true });
      });
      return {
        ok:true,
        updatedAt,
        weeks:await firebaseListWeeks(),
        data:await firebaseGetWeekData(target)
      };
    }

    async function firebaseChangeOwnPassword(studentId, role, nextVisiblePassword) {
      const profile = await firebaseCurrentProfile();
      if (profile.studentId !== studentId || profile.role !== role || !['homeroom','parent'].includes(role)) {
        throw new Error('目前帳號沒有變更此密碼的權限。');
      }
      const actualPassword = await firebaseActualPassword(profile.email, nextVisiblePassword);
      await firebaseApi.updatePassword(firebaseAuth.currentUser, actualPassword);
      return { ok:true };
    }

    async function firebaseResetRolePassword(studentId, role) {
      const profile = await firebaseCurrentProfile();
      if (profile.role !== 'teacher') throw new Error('教師登入已失效，請重新登入。');
      if (!['homeroom','parent'].includes(role)) throw new Error('無效的留言角色。');
      const config = await firebaseReadConfig(true);
      const student = (config.students || []).find(item => item.id === studentId);
      if (!student) throw new Error('找不到此學生資料。');
      const defaultPassword = firebaseDefaultRolePassword(student, role);
      if (!defaultPassword) throw new Error('請先設定學生登入密碼。');
      const directoryReference = firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.loginDirectory, studentId);
      const directorySnapshot = await firebaseApi.getDoc(directoryReference);
      const directory = directorySnapshot.exists() ? directorySnapshot.data() : {
        studentId, name:student.name, active:student.active !== false, accounts:{}
      };
      directory.accounts = directory.accounts || {};
      const oldAccount = directory.accounts[role];
      const nextAccount = await firebaseProvisionRoleAccount(studentId, role, defaultPassword, oldAccount && oldAccount.version);
      const updatedAt = firebaseTimestamp();
      const batch = firebaseApi.writeBatch(firebaseDb);
      if (oldAccount) firebaseQueueAccess(batch, oldAccount, student, role, false, updatedAt);
      directory.accounts[role] = nextAccount;
      directory.name = student.name;
      directory.active = student.active !== false;
      directory.updatedAt = updatedAt;
      firebaseQueueAccess(batch, nextAccount, student, role, student.active !== false, updatedAt);
      batch.set(directoryReference, directory);
      await batch.commit();
      return { ok:true, defaultPassword };
    }

    async function firebaseDeleteReferences(references) {
      for (let start = 0; start < references.length; start += 450) {
        const batch = firebaseApi.writeBatch(firebaseDb);
        references.slice(start, start + 450).forEach(reference => batch.delete(reference));
        await batch.commit();
      }
    }

    async function firebaseDeleteWeek(weekStart) {
      const profile = await firebaseCurrentProfile();
      if (profile.role !== 'teacher') throw new Error('教師登入已失效，請重新登入。');
      const target = weekStartMonday(weekStart);
      const studentQuery = firebaseApi.query(
        firebaseApi.collection(firebaseDb, FIREBASE_COLLECTIONS.studentWeeks),
        firebaseApi.where('weekStart', '==', target)
      );
      const commentQuery = firebaseApi.query(
        firebaseApi.collection(firebaseDb, FIREBASE_COLLECTIONS.comments),
        firebaseApi.where('weekStart', '==', target)
      );
      const snapshots = await Promise.all([
        firebaseApi.getDocs(studentQuery),
        firebaseApi.getDocs(commentQuery)
      ]);
      const references = [
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.publicWeeks, target),
        firebaseApi.doc(firebaseDb, FIREBASE_COLLECTIONS.privateWeeks, target),
        ...snapshots[0].docs.map(item => item.ref),
        ...snapshots[1].docs.map(item => item.ref)
      ];
      await firebaseDeleteReferences(references);
      return { ok:true, weeks:await firebaseListWeeks() };
    }

    async function firebaseSignOutToPublic() {
      if (firebaseAuth && firebaseAuth.currentUser) await firebaseApi.signOut(firebaseAuth);
      state.cloudRole = 'public';
      state.appConfig = normalizeAppConfig(sanitizeAppConfigForPublic(createDefaultAppConfig()));
      persistAppConfig();
      await loadWeek(state.weekStart);
    }

    async function firebaseBackend(method, ...args) {
      if (!firebaseReady) {
        const detail = firebaseInitError && firebaseInitError.message ? '：' + firebaseInitError.message : '';
        throw new Error('Firebase 尚未完成連線' + detail);
      }
      if (method === 'getBootstrap') {
        const weekStart = weekStartMonday(args[0] || initialWeekStart());
        return {
          appTitle:'安東潛能班線上聯絡簿',
          weekStart,
          weeks:await firebaseListWeeks(),
          data:await firebaseGetWeekData(weekStart),
          storageMode:'firebase'
        };
      }
      if (method === 'getWeekData') return firebaseGetWeekData(args[0]);
      if (method === 'listWeeks') return firebaseListWeeks();
      if (method === 'verifyPassword') return firebaseTeacherLogin(String(args[0] || ''));
      if (method === 'verifyIndividualPassword') {
        return firebaseIndividualLogin(String(args[0] || ''), String(args[1] || ''));
      }
      if (method === 'saveIndividualFeedback') {
        return firebaseSaveIndividualFeedback(
          String(args[1] || ''),
          args[2],
          String(args[3] || ''),
          String(args[4] || ''),
          String(args[5] || 'create'),
          String(args[6] || '')
        );
      }
      if (method === 'changeFeedbackPassword') {
        return firebaseChangeOwnPassword(String(args[1] || ''), String(args[2] || ''), String(args[3] || ''));
      }
      if (method === 'resetFeedbackPassword') {
        return firebaseResetRolePassword(String(args[1] || ''), String(args[2] || ''));
      }
      if (method === 'saveWeek') return firebaseSaveWeek(args[1]);
      if (method === 'deleteWeek') return firebaseDeleteWeek(args[1]);
      throw new Error('不支援的 Firebase 操作：' + method);
    }

    function hasServer() {
      return Boolean(window.google && google.script && google.script.run);
    }

    function callBackend(method, ...args) {
      if (!hasServer()) {
        if (firebaseReady) return firebaseBackend(method, ...args);
        if (shouldUseLocalPreview()) return localBackend(method, ...args);
        return Promise.reject(firebaseInitError || new Error('Firebase 尚未完成連線。'));
      }
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))))
          [method](...args);
      });
    }

    function getStorageAdapter() {
      try {
        const testKey = '__potential_contact_book_test__';
        window.localStorage.setItem(testKey, '1');
        window.localStorage.removeItem(testKey);
        return {
          getItem: key => window.localStorage.getItem(key),
          setItem: (key, value) => window.localStorage.setItem(key, value),
          removeItem: key => window.localStorage.removeItem(key),
          keys: () => Object.keys(window.localStorage)
        };
      } catch (error) {
        return {
          getItem: key => Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : null,
          setItem: (key, value) => { memoryStorage[key] = String(value); },
          removeItem: key => { delete memoryStorage[key]; },
          keys: () => Object.keys(memoryStorage)
        };
      }
    }

    async function hashSecret(value) {
      const text = String(value == null ? '' : value);
      if (window.crypto && window.crypto.subtle && window.TextEncoder) {
        const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return 'sha256:' + Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
      }
      let hash = 2166136261;
      for (let index = 0; index < text.length; index += 1) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return 'fallback:' + (hash >>> 0).toString(16).padStart(8, '0');
    }

    async function localBackend(method, ...args) {
      const prefix = 'potential_contact_book_';
      const storage = getStorageAdapter();
      const credentialKey = id => prefix + 'role_credentials_' + String(id || '');
      const readCredentialHashes = id => {
        try {
          const raw = storage.getItem(credentialKey(id));
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
        } catch (error) {
          return {};
        }
      };
      const verifyRolePassword = async (person, role, password) => {
        if (!person || !['homeroom','parent'].includes(role)) return false;
        const hashes = readCredentialHashes(person.id);
        const defaultPassword = (role === 'homeroom' ? 'T' : 'P') + String(person.password || '');
        const expected = hashes[role] || await hashSecret(defaultPassword);
        return expected === await hashSecret(password);
      };
      const localWeeks = () => storage.keys()
        .filter(key => key.startsWith(prefix + 'week_'))
        .map(key => {
          const data = JSON.parse(storage.getItem(key));
          return { weekStart: data.weekStart, updatedAt: data.updatedAt || '' };
        })
        .sort((a,b) => b.weekStart.localeCompare(a.weekStart));

      if (method === 'getBootstrap') {
        const weekStart = weekStartMonday(args[0] || initialWeekStart());
        return { appTitle:'安東潛能班線上聯絡簿', weekStart, weeks:localWeeks(), data:await localBackend('getWeekData', weekStart), storageMode:'local' };
      }
      if (method === 'getWeekData') {
        const weekStart = weekStartMonday(args[0]);
        const raw = storage.getItem(prefix + 'week_' + weekStart);
        return raw ? JSON.parse(raw) : createEmptyWeekClient(weekStart);
      }
      if (method === 'listWeeks') return localWeeks();
      if (method === 'deleteWeek') {
        if (String(args[0] || '') !== 'set') throw new Error('教師密碼已失效，請重新登入。');
        const weekStart = weekStartMonday(args[1] || initialWeekStart());
        storage.removeItem(prefix + 'week_' + weekStart);
        return { ok:true, weeks:localWeeks() };
      }
      if (method === 'verifyPassword') return { ok: String(args[0] || '') === 'set' };
      if (method === 'verifyIndividualPassword') {
        const password = String(args[0] || '');
        const id = String(args[1] || '');
        const weekStart = weekStartMonday(args[2] || initialWeekStart());
        const raw = storage.getItem(prefix + 'week_' + weekStart);
        const data = normalizeClientData(raw ? JSON.parse(raw) : createEmptyWeekClient(weekStart), weekStart);
        const person = data.individuals.find(item => item.id === id);
        if (!person) return { ok:false };
        if (String(person.password || '') === password) return { ok:true, role:'viewer' };
        if (await verifyRolePassword(person, 'homeroom', password)) return { ok:true, role:'homeroom' };
        if (await verifyRolePassword(person, 'parent', password)) return { ok:true, role:'parent' };
        return { ok:false };
      }
      if (method === 'saveIndividualFeedback') {
        const password = String(args[0] || '');
        const id = String(args[1] || '');
        const weekStart = weekStartMonday(args[2] || initialWeekStart());
        const role = String(args[3] || '');
        const value = String(args[4] || '');
        const action = String(args[5] || 'create');
        const targetId = String(args[6] || '');
        if (!['homeroom','parent'].includes(role)) throw new Error('目前帳號沒有此留言權限。');
        const raw = storage.getItem(prefix + 'week_' + weekStart);
        const data = normalizeClientData(raw ? JSON.parse(raw) : createEmptyWeekClient(weekStart), weekStart);
        const person = data.individuals.find(item => item.id === id);
        if (!person || !await verifyRolePassword(person, role, password)) throw new Error('留言密碼已失效，請重新登入。');
        const updatedAt = new Intl.DateTimeFormat('zh-TW', { dateStyle:'short', timeStyle:'medium', hour12:false }).format(new Date());
        const family = getFamilyFeedback(person);
        family[role] = appendCommentMutation(
          family[role],
          { role, author:getIndividualRoleLabel(role), teacherId:'' },
          action,
          targetId,
          value
        );
        family.updatedAt = updatedAt;
        person.familyFeedback = family;
        data.updatedAt = updatedAt;
        storage.setItem(prefix + 'week_' + data.weekStart, JSON.stringify(data));
        return { ok:true, updatedAt, weeks:localWeeks(), data };
      }
      if (method === 'changeFeedbackPassword') {
        const password = String(args[0] || '');
        const id = String(args[1] || '');
        const role = String(args[2] || '');
        const nextPassword = String(args[3] || '').trim();
        const weekStart = weekStartMonday(args[4] || initialWeekStart());
        if (nextPassword.length < 4) throw new Error('新密碼至少需要 4 個字元。');
        const raw = storage.getItem(prefix + 'week_' + weekStart);
        const data = normalizeClientData(raw ? JSON.parse(raw) : createEmptyWeekClient(weekStart), weekStart);
        const person = data.individuals.find(item => item.id === id);
        if (!person || !await verifyRolePassword(person, role, password)) throw new Error('目前密碼已失效，請重新登入。');
        const hashes = readCredentialHashes(id);
        hashes[role] = await hashSecret(nextPassword);
        storage.setItem(credentialKey(id), JSON.stringify(hashes));
        return { ok:true };
      }
      if (method === 'resetFeedbackPassword') {
        const adminPassword = String(args[0] || '');
        const id = String(args[1] || '');
        const role = String(args[2] || '');
        const weekStart = weekStartMonday(args[3] || initialWeekStart());
        if (adminPassword !== 'set') throw new Error('教師密碼已失效，請重新登入。');
        if (!['homeroom','parent'].includes(role)) throw new Error('無效的留言角色。');
        const raw = storage.getItem(prefix + 'week_' + weekStart);
        const data = normalizeClientData(raw ? JSON.parse(raw) : createEmptyWeekClient(weekStart), weekStart);
        const person = data.individuals.find(item => item.id === id);
        if (!person) throw new Error('找不到此個案資料。');
        const hashes = readCredentialHashes(id);
        delete hashes[role];
        storage.setItem(credentialKey(id), JSON.stringify(hashes));
        const defaultPassword = (role === 'homeroom' ? 'T' : 'P') + String(person.password || '');
        return { ok:true, defaultPassword };
      }
      if (method === 'saveWeek') {
        if (!String(args[0] || '').trim()) throw new Error('請先輸入密碼。');
        const data = normalizeClientData(args[1], args[1].weekStart);
        data.updatedAt = new Intl.DateTimeFormat('zh-TW', { dateStyle:'short', timeStyle:'medium', hour12:false }).format(new Date());
        storage.setItem(prefix + 'week_' + data.weekStart, JSON.stringify(data));
        return { ok:true, updatedAt:data.updatedAt, weeks:localWeeks(), data };
      }
      throw new Error('不支援的本機操作：' + method);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g,'&#096;');
    }

    function showToast(message, isError = false) {
      clearTimeout(toastTimer);
      els.toast.textContent = message;
      els.toast.classList.toggle('error', isError);
      els.toast.classList.add('show');
      toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2600);
    }
  </script>
</body>
