    function bindSettingsCenterEvents() {
      const root = els.utilityContent;
      document.getElementById('saveSettingsBtn').addEventListener('click', saveAppSettings);
      root.querySelectorAll('[data-settings-section]').forEach(details => details.addEventListener('toggle', event => {
        const sectionId = event.currentTarget.dataset.settingsSection;
        const openSections = new Set(state.settingsOpenSections || []);
        if (event.currentTarget.open) openSections.add(sectionId); else openSections.delete(sectionId);
        state.settingsOpenSections = Array.from(openSections);
      }));
      root.querySelectorAll('[data-open-student-password-manager]').forEach(button => button.addEventListener('click', event => {
        const modal = root.querySelector(`[data-student-password-manager="${CSS.escape(event.currentTarget.dataset.openStudentPasswordManager)}"]`);
        if (!modal) return;
        modal.hidden = false;
        modal.focus();
      }));
      root.querySelectorAll('[data-close-student-password-manager]').forEach(button => button.addEventListener('click', event => {
        const modal = event.currentTarget.closest('[data-student-password-manager]');
        if (modal) modal.hidden = true;
      }));
      root.querySelectorAll('[data-student-password-manager]').forEach(modal => {
        modal.addEventListener('click', event => { if (event.target === modal) modal.hidden = true; });
        modal.addEventListener('keydown', event => { if (event.key === 'Escape') modal.hidden = true; });
      });
      root.querySelectorAll('[data-term-field]').forEach(input => {
        const handler = event => {
          const term = state.settingsDraft.terms[Number(event.currentTarget.dataset.termIndex)];
          const field = event.currentTarget.dataset.termField;
          if (field === 'startDate' && !event.currentTarget.value) return;
          term[field] = field === 'weekCount' ? Math.min(30, Math.max(1, Number(event.currentTarget.value) || 1)) : weekStartMonday(event.currentTarget.value);
          markSettingsDirty();
        };
        input.addEventListener('input', handler);
        input.addEventListener('change', handler);
      });
      root.querySelectorAll('[data-student-field]').forEach(input => {
        const handler = event => {
          const index = Number(event.currentTarget.dataset.studentIndex);
          const student = state.settingsDraft.students[index];
          const field = event.currentTarget.dataset.studentField;
          const oldName = student.name;
          student[field] = String(event.currentTarget.value || '').trim();
          if (field === 'name' && oldName !== student.name) {
            Object.values(state.settingsDraft.schedules || {}).forEach(byTeacher => TEACHERS.forEach(teacher => {
              (byTeacher[teacher.id] || []).forEach(entry => { entry.students = (entry.students || []).map(name => name === oldName ? student.name : name); });
            }));
          }
          markSettingsDirty();
        };
        input.addEventListener('input', handler);
        input.addEventListener('change', handler);
      });
      root.querySelectorAll('[data-student-active]').forEach(input => input.addEventListener('change', event => {
        state.settingsDraft.students[Number(event.currentTarget.dataset.studentIndex)].active = event.currentTarget.checked;
        markSettingsDirty();
        renderSettingsCenter();
      }));
      root.querySelectorAll('[data-group-field]').forEach(input => {
        const handler = event => {
          const group = getSettingsStudentGroups()[Number(event.currentTarget.dataset.groupIndex)];
          group[event.currentTarget.dataset.groupField] = String(event.currentTarget.value || '').trim();
          markSettingsDirty();
        };
        input.addEventListener('input', handler);
        input.addEventListener('change', handler);
      });
      root.querySelectorAll('[data-group-student-index]').forEach(input => input.addEventListener('change', event => {
        const group = getSettingsStudentGroups()[Number(event.currentTarget.dataset.groupStudentIndex)];
        const selected = new Set(group.studentIds || []);
        if (event.currentTarget.checked) selected.add(event.currentTarget.value); else selected.delete(event.currentTarget.value);
        group.studentIds = Array.from(selected);
        markSettingsDirty();
      }));
      root.querySelectorAll('[data-remove-student-group]').forEach(button => button.addEventListener('click', event => {
        const index = Number(event.currentTarget.dataset.removeStudentGroup);
        const removed = getSettingsStudentGroups()[index];
        if (!removed) return;
        Object.values(state.settingsDraft.schedules || {}).forEach(byTeacher => TEACHERS.forEach(teacher => {
          (byTeacher[teacher.id] || []).forEach(entry => {
            if (entry.groupId === removed.id) {
              entry.groupId = 'custom';
              entry.customGroup = removed.name;
            }
          });
        }));
        getSettingsStudentGroups().splice(index, 1);
        markSettingsDirty();
        renderSettingsCenter();
      }));
      root.querySelectorAll('[data-select-settings-schedule]').forEach(button => button.addEventListener('click', event => {
        state.settingsScheduleId = event.currentTarget.dataset.selectSettingsSchedule;
        state.settingsScheduleEditorOpen = true;
        renderSettingsCenter();
      }));
      root.querySelectorAll('[data-add-settings-schedule]').forEach(button => button.addEventListener('click', event => {
        const entry = createSettingsScheduleEntry(
          Number(event.currentTarget.dataset.addSettingsDay),
          event.currentTarget.dataset.addSettingsSlot,
          event.currentTarget.dataset.addSettingsTime
        );
        getSettingsSchedule().push(entry);
        state.settingsScheduleId = entry.id;
        state.settingsScheduleEditorOpen = true;
        markSettingsDirty();
        renderSettingsCenter();
      }));
      const closeScheduleEditor = () => {
        state.settingsScheduleEditorOpen = false;
        renderSettingsCenter();
      };
      root.querySelectorAll('[data-close-schedule-editor]').forEach(button => button.addEventListener('click', closeScheduleEditor));
      root.querySelectorAll('[data-schedule-editor-backdrop]').forEach(backdrop => backdrop.addEventListener('click', event => {
        if (event.target === event.currentTarget) closeScheduleEditor();
      }));
      root.querySelectorAll('[data-selected-schedule-field]').forEach(input => {
        const handler = event => {
          const entry = getSelectedSettingsScheduleEntry();
          if (!entry) return;
          const field = event.currentTarget.dataset.selectedScheduleField;
          if (field === 'day') {
            entry.day = Number(event.currentTarget.value);
            if (isScheduleBlocked(entry.day, entry.slot)) {
              const replacement = PERIOD_OPTIONS.find(option => option.value !== 'custom' && !isScheduleBlocked(entry.day, option.value));
              entry.slot = replacement ? replacement.value : '自訂節次';
              entry.time = replacement ? replacement.time : '';
            }
            markSettingsDirty();
            renderSettingsCenter();
            return;
          }
          entry[field] = event.currentTarget.value;
          if (field === 'customCourseType') entry.scope = courseTypeToScope(entry.customCourseType);
          markSettingsDirty();
        };
        input.addEventListener('input', handler);
        input.addEventListener('change', handler);
      });
      root.querySelectorAll('[data-selected-schedule-color]').forEach(input => input.addEventListener('change', event => {
        const entry = getSelectedSettingsScheduleEntry();
        if (!entry) return;
        entry.color = normalizeScheduleColor(event.currentTarget.value);
        markSettingsDirty();
        renderSettingsCenter();
      }));
      const periodSelect = document.getElementById('settingsPeriodSelect');
      if (periodSelect) periodSelect.addEventListener('change', event => {
        const entry = getSelectedSettingsScheduleEntry();
        if (!entry) return;
        if (event.target.value === 'custom') {
          if (getPeriodOption(entry.slot)) {
            entry.slot = '自訂節次';
            entry.time = '';
          }
        } else {
          const period = getPeriodOption(event.target.value);
          entry.slot = period.value;
          entry.time = period.time;
        }
        markSettingsDirty();
        renderSettingsCenter();
      });
      const courseTypeSelect = document.getElementById('settingsCourseTypeSelect');
      if (courseTypeSelect) courseTypeSelect.addEventListener('change', event => {
        const entry = getSelectedSettingsScheduleEntry();
        if (!entry) return;
        entry.courseType = event.target.value;
        if (entry.courseType !== 'custom') entry.customCourseType = '';
        entry.scope = courseTypeToScope(entry.courseType === 'custom' ? entry.customCourseType : entry.courseType);
        markSettingsDirty();
        renderSettingsCenter();
      });
      const groupSelect = document.getElementById('settingsGroupSelect');
      if (groupSelect) groupSelect.addEventListener('change', event => {
        const entry = getSelectedSettingsScheduleEntry();
        if (!entry) return;
        if (event.target.value === 'none') {
          entry.groupId = '';
          entry.customGroup = '';
        } else if (event.target.value === 'custom') {
          entry.groupId = 'custom';
          entry.customGroup = entry.customGroup || '';
        } else {
          const group = getSettingsStudentGroups().find(item => item.id === event.target.value);
          entry.groupId = group ? group.id : '';
          entry.customGroup = '';
          if (group) entry.students = uniqueValues([...(entry.students || []), ...getStudentGroupNames(group)]);
        }
        markSettingsDirty();
        renderSettingsCenter();
      });
      root.querySelectorAll('[data-add-student-group]').forEach(button => button.addEventListener('click', event => {
        const entry = getSelectedSettingsScheduleEntry();
        const group = getSettingsStudentGroups().find(item => item.id === event.currentTarget.dataset.addStudentGroup);
        if (!entry || !group) return;
        entry.groupId = group.id;
        entry.customGroup = '';
        entry.students = uniqueValues([...(entry.students || []), ...getStudentGroupNames(group)]);
        markSettingsDirty();
        renderSettingsCenter();
      }));
      root.querySelectorAll('[data-selected-schedule-student]').forEach(input => input.addEventListener('change', event => {
        const entry = getSelectedSettingsScheduleEntry();
        if (!entry) return;
        const selected = new Set(entry.students || []);
        if (event.currentTarget.checked) selected.add(event.currentTarget.value); else selected.delete(event.currentTarget.value);
        entry.students = Array.from(selected);
        markSettingsDirty();
      }));
      const removeSelected = root.querySelector('[data-remove-selected-schedule]');
      if (removeSelected) removeSelected.addEventListener('click', () => {
        const schedules = getSettingsSchedule();
        const index = schedules.findIndex(entry => entry.id === state.settingsScheduleId);
        if (index >= 0) schedules.splice(index, 1);
        state.settingsScheduleId = (schedules[0] || {}).id || '';
        state.settingsScheduleEditorOpen = false;
        markSettingsDirty();
        renderSettingsCenter();
      });
      root.querySelectorAll('[data-settings-teacher]').forEach(button => button.addEventListener('click', event => {
        state.settingsTeacherId = event.currentTarget.dataset.settingsTeacher;
        state.settingsScheduleId = (getSettingsSchedule()[0] || {}).id || '';
        state.settingsScheduleEditorOpen = false;
        renderSettingsCenter();
      }));
      const settingsTermSelect = document.getElementById('settingsTermSelect');
      if (settingsTermSelect) settingsTermSelect.addEventListener('change', event => {
        state.settingsTermId = event.target.value;
        state.settingsScheduleId = (getSettingsSchedule()[0] || {}).id || '';
        state.settingsScheduleEditorOpen = false;
        renderSettingsCenter();
      });
      const addStudentButton = document.getElementById('addStudentSettingBtn');
      if (addStudentButton) addStudentButton.addEventListener('click', () => {
        state.settingsDraft.students.push({ id:`student-${Date.now()}`, name:`新個案 ${state.settingsDraft.students.length + 1}`, password:'', active:true });
        markSettingsDirty();
        renderSettingsCenter();
      });
      const addGroupButton = document.getElementById('addStudentGroupBtn');
      if (addGroupButton) addGroupButton.addEventListener('click', () => {
        getSettingsStudentGroups().push({ id:`student-group-${Date.now()}`, name:`新組別 ${getSettingsStudentGroups().length + 1}`, studentIds:[] });
        markSettingsDirty();
        renderSettingsCenter();
      });
      const addScheduleButton = document.getElementById('addScheduleSettingBtn');
      if (addScheduleButton) addScheduleButton.addEventListener('click', () => {
        const entry = createSettingsScheduleEntry(0, '自訂節次', '');
        getSettingsSchedule().push(entry);
        state.settingsScheduleId = entry.id;
        state.settingsScheduleEditorOpen = true;
        markSettingsDirty();
        renderSettingsCenter();
      });
      ['newTermYear','newTermSemester','newTermStart','newTermWeeks'].forEach(id => {
        const input = document.getElementById(id);
        if (!input) return;
        const handler = event => {
          const map = { newTermYear:'schoolYear', newTermSemester:'semester', newTermStart:'startDate', newTermWeeks:'weekCount' };
          state.newTermDraft[map[id]] = ['schoolYear','semester','weekCount'].includes(map[id]) ? Number(event.target.value) : event.target.value;
        };
        input.addEventListener('input', handler);
        input.addEventListener('change', handler);
      });
      const addEmptyTermButton = document.getElementById('addEmptyTermBtn');
      const addClonedTermButton = document.getElementById('addClonedTermBtn');
      if (addEmptyTermButton) addEmptyTermButton.addEventListener('click', () => addTermFromDraft(false));
      if (addClonedTermButton) addClonedTermButton.addEventListener('click', () => addTermFromDraft(true));
      root.querySelectorAll('[data-danger-action]').forEach(button => button.addEventListener('click', event => handleDangerAction(event.currentTarget.dataset.dangerAction)));
    }

    function addTermFromDraft(cloneSchedule) {
      const schoolYear = Math.min(999, Math.max(1, Number(state.newTermDraft.schoolYear) || 0));
      const semester = Number(state.newTermDraft.semester) === 2 ? 2 : 1;
      const startDate = String(state.newTermDraft.startDate || '');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(startDate)) {
        showToast('請先設定新學期第 1 週日期', true);
        return;
      }
      const id = termIdFor(schoolYear, semester);
      if (state.settingsDraft.terms.some(term => term.id === id)) {
        showToast(`${schoolYear} 學年度${semester === 2 ? '下學期' : '上學期'}已存在`, true);
        return;
      }
      state.settingsDraft.terms.push({ id, schoolYear, semester, startDate:weekStartMonday(startDate), weekCount:Math.min(30, Math.max(1, Number(state.newTermDraft.weekCount) || 21)) });
      state.settingsDraft.terms.sort((a,b) => a.startDate.localeCompare(b.startDate));
      const sourceTermId = state.settingsTermId;
      state.settingsDraft.schedules[id] = {};
      TEACHERS.forEach(teacher => {
        const source = cloneSchedule && state.settingsDraft.schedules[sourceTermId] ? state.settingsDraft.schedules[sourceTermId][teacher.id] || [] : [];
        state.settingsDraft.schedules[id][teacher.id] = source.map((entry, index) => ({ ...deepClone(entry), id:`schedule-${teacher.id}-${Date.now()}-${index}`, teacherId:teacher.id }));
      });
      state.settingsTermId = id;
      state.newTermDraft = semester === 1
        ? { schoolYear, semester:2, startDate:'', weekCount:21 }
        : { schoolYear:schoolYear + 1, semester:1, startDate:'', weekCount:21 };
      markSettingsDirty();
      renderSettingsCenter();
    }

    function validateSettingsDraft() {
      const active = (state.settingsDraft.students || []).filter(student => student.active !== false);
      if (active.some(student => !String(student.name || '').trim())) throw new Error('啟用中的學生名稱不可空白。');
      if (active.some(student => !String(student.password || '').trim())) throw new Error('啟用中的學生需設定登入密碼。');
      const normalizedNames = active.map(student => normalizeStudentName(student.name));
      if (new Set(normalizedNames).size !== normalizedNames.length) throw new Error('學生名稱不可重複。');
      const groups = getSettingsStudentGroups();
      if (groups.some(group => !String(group.name || '').trim())) throw new Error('學生組別名稱不可空白。');
      const normalizedGroupNames = groups.map(group => String(group.name || '').trim().toLowerCase());
      if (new Set(normalizedGroupNames).size !== normalizedGroupNames.length) throw new Error('學生組別名稱不可重複。');
      Object.values(state.settingsDraft.schedules || {}).forEach(byTeacher => TEACHERS.forEach(teacher => {
        (byTeacher[teacher.id] || []).forEach(entry => {
          if (!String(entry.slot || '').trim()) throw new Error(`${teacher.name}的節次名稱不可空白。`);
          if (entry.courseType === 'custom' && !String(entry.customCourseType || '').trim()) throw new Error(`${teacher.name}的自訂課程類型不可空白。`);
          if (entry.groupId === 'custom' && !String(entry.customGroup || '').trim()) throw new Error(`${teacher.name}的自訂組別名稱不可空白。`);
        });
      }));
    }

    async function saveAppSettings() {
      const button = document.getElementById('saveSettingsBtn');
      try {
        validateSettingsDraft();
        if (button) { button.disabled = true; button.textContent = '儲存中…'; }
        state.settingsDraft.updatedAt = new Date().toISOString();
        state.appConfig = normalizeAppConfig(state.settingsDraft);
        state.appConfig.updatedAt = state.settingsDraft.updatedAt;
        state.data.appConfig = deepClone(state.appConfig);
        state.data = normalizeClientData(state.data, state.weekStart);
        const result = await callBackend('saveWeek', state.password, state.data);
        state.data = normalizeClientData(result.data || state.data, state.weekStart);
        state.data.updatedAt = result.updatedAt || state.data.updatedAt;
        state.originalData = deepClone(state.data);
        state.originalConfig = deepClone(state.appConfig);
        persistAppConfig();
        state.weeks = Array.isArray(result.weeks) ? result.weeks : await callBackend('listWeeks');
        state.dirty = false;
        state.settingsDirty = false;
        state.settingsDraft = deepClone(state.appConfig);
        state.selectedScheduleId = (getTimetable(state.termId, state.teacherId)[0] || {}).id || '';
        renderAll();
        closeUtility(true);
        showToast('學生名單、學期與兩位老師課表已同步');
      } catch (error) {
        console.error(error);
        showToast(error.message || '設定儲存失敗', true);
      } finally {
        if (button) { button.disabled = false; button.textContent = '儲存全部設定'; }
      }
    }

    async function handleDangerAction(action) {
      const confirmInput = document.getElementById('dangerConfirmInput');
      if (!confirmInput || confirmInput.value.trim() !== '刪除') {
        showToast('請先輸入「刪除」再執行', true);
        return;
      }
      if (action === 'schedules') {
        if (!confirm('確定要清除所有學期中，傅老師與李老師的全部課表設定嗎？')) return;
        Object.keys(state.settingsDraft.schedules || {}).forEach(termId => TEACHERS.forEach(teacher => { state.settingsDraft.schedules[termId][teacher.id] = []; }));
        markSettingsDirty();
        await saveAppSettings();
        showToast('兩位老師的全部課表設定已清除');
        return;
      }
      if (state.settingsDirty) {
        showToast('請先儲存或關閉尚未儲存的設定，再刪除紀錄', true);
        return;
      }
      const term = getSettingsTerm() || getActiveTerm();
      const ranges = action === 'semester'
        ? [{ start:term.startDate, end:getTermEndDate(term) }]
        : action === 'year'
          ? [schoolYearDateRange(term.schoolYear)]
          : [{ start:'0000-01-01', end:'9999-12-31' }];
      const label = action === 'semester' ? termLabel(term) : action === 'year' ? `${term.schoolYear} 學年度` : '全部學年度';
      if (!confirm(`確定要刪除「${label}」的全部聯絡簿紀錄嗎？此動作無法復原。`)) return;
      try {
        const starts = uniqueValues((state.weeks || []).map(item => item.weekStart)).filter(weekStart => ranges.some(range => weekStart >= weekStartMonday(range.start) && weekStart <= weekStartMonday(range.end)));
        for (const weekStart of starts) {
          if (hasServer()) {
            const blank = createEmptyWeekClient(weekStart);
            blank.appConfig = deepClone(state.appConfig);
            await callBackend('saveWeek', state.password, blank);
          } else {
            await callBackend('deleteWeek', state.password, weekStart);
          }
        }
        state.weeks = await callBackend('listWeeks');
        state.dirty = false;
        state.feedbackDirty = false;
        state.feedbackDraft = '';
        state.commentEdit = null;
        closeUtility(true);
        await loadWeek(initialWeekStart(getActiveTerm()));
        showToast(`已刪除${label}的 ${starts.length} 週紀錄`);
      } catch (error) {
        console.error(error);
        showToast(error.message || '紀錄刪除失敗', true);
      }
    }

    function downloadText(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function getTeacherStudents(groupId, teacherId = state.teacherId) {
      const individuals = getIndividuals();
      const group = getGroups().find(item => item.id === groupId) || { scope: 'all' };
      return individuals.filter(person => {
        if (groupId === 'all') return true;
        return person.groupId === groupId || hasAnyAssignment(person, group.scope);
      });
    }

    function hasAnyAssignment(person, scope) {
      return TEACHERS.some(teacher => hasTeacherAssignment(person, teacher.id, scope));
    }

    function hasTeacherAssignment(person, teacherId, scope = 'all') {
      const assignment = person && person.teacherAssignments && person.teacherAssignments[teacherId];
      if (!assignment) return false;
      if (scope === 'all') return ['chinese', 'math', 'special'].some(key => Boolean(assignment[key]));
      return Boolean(assignment[scope]);
    }

    function getSelectedTeacherStudent(students) {
      if (!students.length) return null;
      let index = students.findIndex(person => person.id === state.selectedIndividualId);
      if (index < 0) index = 0;
      state.selectedIndividualId = students[index].id;
      const allIndex = getIndividuals().findIndex(person => person.id === students[index].id);
      return { person: students[index], index: allIndex };
    }

    function renderTeacherDayCard(day, index, scope, teacherId, scheduleEntry = null) {
      const date = parseISO(day.date);
      const wide = state.viewMode === 'week' && index === 4 ? 'wide' : '';
      const disabledClass = day.enabled ? '' : 'is-disabled';
      return `
        <article class="day-card ${wide} ${disabledClass}">
          <header class="day-header">
            <div>
              <h2>${weekdayName(index)}</h2>
              <div class="date">${date.getFullYear()} 年 ${date.getMonth()+1} 月 ${date.getDate()} 日</div>
              <label class="holiday-label">國定假日／停課備註
                <input class="input holiday-input" data-bind="days.${index}.holidayNote" value="${escapeAttr(day.holidayNote)}" placeholder="例如：中秋連假">
              </label>
            </div>
            <label class="toggle"><input type="checkbox" data-bool="days.${index}.enabled" ${day.enabled ? 'checked' : ''}> 本日上課</label>
          </header>
          <div class="day-body">
            ${scheduleEntry ? `<div class="selected-class-banner ${getScheduleToneClass(scheduleEntry)}"><strong>${escapeHtml(scheduleEntry.slot)}・${escapeHtml(getScheduleDisplayTitle(scheduleEntry))}</strong><span>${escapeHtml(scheduleEntry.time)}｜${escapeHtml(scheduleEntry.students.join('、'))}</span></div>` : ''}
            ${day.enabled ? renderTeacherFields(day, index, scope, teacherId, scheduleEntry) : '<div class="empty-state">本日設定為不上課。勾選「本日上課」後即可填寫。</div>'}
          </div>
        </article>`;
    }

    function renderTeacherFields(day, index, scope, teacherId, scheduleEntry = null) {
      if (scope === 'chinese') return renderTeacherChinese(day, index, teacherId, scheduleEntry);
      if (scope === 'math') return renderTeacherMath(day, index, teacherId, scheduleEntry);
      if (scope === 'special') return renderTeacherSpecial(day, index, teacherId, true, scheduleEntry);
      return renderTeacherGeneral(day, index, teacherId) + renderTeacherSpecial(day, index, teacherId) + renderEditCommon(day, index);
    }

    function getTeacherCourseSet(day, teacherId) {
      const blank = createEmptyTeacherCourseSet();
      const source = day && day.teacherCourses && day.teacherCourses[teacherId];
      if (source && typeof source === 'object') return deepMerge(blank, source);
      if (teacherId === 'mary') {
        const general = day.general || {};
        const special = day.special || {};
        blank.chinese = {
          lesson: general.chineseLesson || '', topics: Array.isArray(general.chineseTopics) ? [...general.chineseTopics] : [], other: general.chineseOther || '', homework: general.chineseHomework || ''
        };
        blank.math = { unit: general.mathUnit || '', content: general.mathContent || '', homework: general.mathHomework || '' };
        blank.special = {
          subject: special.subject || '', categories: Array.isArray(special.categories) ? [...special.categories] : [], otherCategory: special.otherCategory || '', content: special.content || '', homework: special.homework || ''
        };
      }
      return blank;
    }

    function getScheduleCourseSet(day, scheduleEntry) {
      if (!scheduleEntry) return getTeacherCourseSet(day, state.teacherId);
      if (!day.scheduleCourses || typeof day.scheduleCourses !== 'object') day.scheduleCourses = {};
      if (!day.scheduleCourses[scheduleEntry.id]) {
        const blank = createEmptyTeacherCourseSet();
        const legacy = getTeacherCourseSet(day, scheduleEntry.teacherId || state.teacherId);
        if (legacy && legacy[scheduleEntry.scope]) blank[scheduleEntry.scope] = deepClone(legacy[scheduleEntry.scope]);
        day.scheduleCourses[scheduleEntry.id] = blank;
      }
      return day.scheduleCourses[scheduleEntry.id];
    }

    function getTeacherCoursePath(index, teacherId, scope, scheduleEntry) {
      return scheduleEntry
        ? `days.${index}.scheduleCourses.${scheduleEntry.id}.${scope}`
        : `days.${index}.teacherCourses.${teacherId}.${scope}`;
    }

    function renderTeacherChinese(day, index, teacherId, scheduleEntry = null) {
      const c = (scheduleEntry ? getScheduleCourseSet(day, scheduleEntry) : getTeacherCourseSet(day, teacherId)).chinese;
      const path = getTeacherCoursePath(index, teacherId, 'chinese', scheduleEntry);
      return `
        <section class="section general">
          <h3>📘 國語・${escapeHtml(getTeacher(teacherId).name)}</h3>
          <div class="subsection">
            <div class="row">
              <div class="field"><label>國語課次</label><input class="input" data-bind="${path}.lesson" value="${escapeAttr(c.lesson)}" placeholder="例如：第 5 課"></div>
              <div class="field"><label>其他教學項目</label><input class="input" data-bind="${path}.other" value="${escapeAttr(c.other)}" placeholder="例如：短文仿寫"></div>

            <div class="field" style="margin-top:10px"><div class="homework-label-row"><label>國語每日功課</label>${renderQuickHomeworkControl(path)}</div><textarea class="textarea" data-bind="${path}.homework" placeholder="可留白，或使用右側的快速加入">${escapeHtml(c.homework)}</textarea></div>
          </div>
        </section>`;
    }

    function renderTeacherMath(day, index, teacherId, scheduleEntry = null) {
      const c = (scheduleEntry ? getScheduleCourseSet(day, scheduleEntry) : getTeacherCourseSet(day, teacherId)).math;
      const path = getTeacherCoursePath(index, teacherId, 'math', scheduleEntry);
      return `
        <section class="section general">
          <h3>➗ 數學・${escapeHtml(getTeacher(teacherId).name)}</h3>

            </div>
            <div class="field" style="margin-top:10px"><div class="homework-label-row"><label>數學每日功課</label>${renderQuickHomeworkControl(path)}</div><textarea class="textarea" data-bind="${path}.homework" placeholder="可留白，或使用右側的快速加入">${escapeHtml(c.homework)}</textarea></div>
          </div>
        </section>`;

    function renderTeacherGeneral(day, index, teacherId) {
      return `
        <section class="section general">
          <div class="toggle-row">
            <h3>📘 國語與數學・${escapeHtml(getTeacher(teacherId).name)}</h3>

    function renderTeacherSpecial(day, index, teacherId, forceVisible = false, scheduleEntry = null) {
      const c = (scheduleEntry ? getScheduleCourseSet(day, scheduleEntry) : getTeacherCourseSet(day, teacherId)).special;
      const path = getTeacherCoursePath(index, teacherId, 'special', scheduleEntry);
      const visible = forceVisible || day.specialEnabled;

        <section class="section special">
          <div class="toggle-row">
            <h3>🧩 特殊需求課程・${escapeHtml(getTeacher(teacherId).name)}</h3>

          </div>
          ${visible ? `
            <div class="field"><label>教學內容</label><textarea class="textarea large" data-bind="${path}.content" placeholder="填寫本節特殊需求課程教學內容">${escapeHtml(c.content)}</textarea></div>
            <div class="field" style="margin-top:10px"><div class="homework-label-row"><label>每日功課</label>${renderQuickHomeworkControl(path)}</div><textarea class="textarea" data-bind="${path}.homework" placeholder="可留白，或使用右側的快速加入">${escapeHtml(c.homework)}</textarea></div>` : '<div class="empty-state">本區已隱藏</div>'}

    function renderIndividualPage() {
      const individuals = getIndividuals();
      if (!individuals.length) {
        els.content.innerHTML = '<section class="empty-state">尚未建立個案資料。請先進入編輯模式新增個案。</section>';
        return;
      }

      if (state.editing) {
        renderIndividualAdminPage(individuals);
        return;
      }

      if (!state.unlockedIndividualId) {
        renderIndividualDirectory(individuals);
        return;
      }

      const person = getIndividualById(state.unlockedIndividualId);
      if (!person) {
        state.unlockedIndividualId = '';
        renderIndividualDirectory(individuals);
        return;
      }
      state.selectedIndividualId = person.id;
      const personIndex = individuals.findIndex(item => item.id === person.id);
      const indexes = state.viewMode === 'week' ? [0,1,2,3,4] : [state.dayIndex];
      const studentSchedule = getStudentSchedule(person.name);
      const courseCards = indexes.map(index => {
        const scheduleEntries = studentSchedule.filter(item => item.day === index);
        const allowedScopes = uniqueValues(scheduleEntries.map(item => item.scope));
        return renderDayCard(state.data.days[index], index, 'all', { privateView: true, allowedScopes, scheduleEntries });
      }).join('');
      const recordCards = indexes.map(index => renderIndividualRecordDay(person, index)).join('');
      els.content.innerHTML = `
        <div class="private-toolbar">
          <button class="btn btn-soft" id="individualBackBtn" type="button">← 返回個案名單</button>
          <span class="badge badge-green">🔓 ${escapeHtml(person.name || person.id)}・${escapeHtml(getIndividualRoleLabel(state.individualRole))}模式</span>
        </div>
        ${renderStudentSchedule(person)}
        <h2 class="private-section-title">本週課程與評量紀錄</h2>
        <div class="days-grid ${state.viewMode === 'week' ? 'week-view' : ''}">${courseCards}</div>
        <details class="private-panel teacher-record-accordion individual-record-accordion">
          <summary>
            <span class="teacher-record-summary-copy">
              <strong>個案學習紀錄</strong>
              <span>${escapeHtml(person.name || '未命名個案')}・${escapeHtml(getTeacherAssignmentSummary(person))}・點擊展開查看</span>
            </span>
          </summary>
          <div class="teacher-record-accordion-body">
            <div class="detail-grid">${recordCards}</div>
          </div>
        </details>
        ${renderIndividualComments(person, personIndex)}`;

      bindDynamicInputs(els.content);
      bindIndividualFeedbackInputs(els.content);
      bindCommentThreadControls(els.content);
      document.getElementById('individualBackBtn').addEventListener('click', async () => {
        if ((state.feedbackDirty || state.commentEdit) && !confirm('導師或家長留言尚未儲存，確定返回個案名單嗎？')) return;
        state.unlockedIndividualId = '';
        state.individualPassword = '';
        state.individualRole = 'viewer';
        state.feedbackDirty = false;
        state.feedbackDraft = '';
        state.commentEdit = null;
        if (firebaseReady) await firebaseSignOutToPublic();
        else renderAll();
      });
    }

    function renderStudentSchedule(person) {
      const entries = getStudentSchedule(person.name);
      const scheduleSummary = entries.length ? `共 ${entries.length} 個課程時段・點擊展開查看` : '目前無排定潛能班課程・點擊展開查看';
      return `<details class="private-panel teacher-record-accordion student-schedule-accordion">
        <summary>
          <span class="teacher-record-summary-copy">
            <strong>每週固定課表</strong>
            <span>${escapeHtml(person.name || '未命名個案')}・${scheduleSummary}</span>
          </span>
        </summary>
        <div class="teacher-record-accordion-body">
          <div class="student-schedule-grid">
            ${[0,1,2,3,4].map(dayIndex => {
              const dayEntries = entries.filter(item => item.day === dayIndex);
              return `<article class="student-schedule-day"><h3>${weekdayName(dayIndex)}</h3>
                ${dayEntries.length ? dayEntries.map(item => `<div class="student-schedule-item"><strong>${escapeHtml(item.slot)}・${escapeHtml(getScheduleDisplayTitle(item))}</strong><br>${escapeHtml(item.time)}${item.time ? '｜' : ''}${escapeHtml(getTeacher(item.teacherId).name)}</div>`).join('') : '<div class="value empty">無排定潛能班課程</div>'}
              </article>`;
            }).join('')}
          </div>
        </div>
      </details>`;
    }

    function getIndividuals() {
      const individuals = Array.isArray(state.data && state.data.individuals) ? state.data.individuals : [];
      const activeIds = new Set(getStudentRoster().map(student => student.id));
      return individuals.filter(person => activeIds.has(person.id));
    }

    function getIndividualById(id) {
      return getIndividuals().find(person => person.id === id) || null;
    }

    function renderIndividualDirectory(individuals) {
      els.content.innerHTML = `
        <section class="private-panel">
          <div class="eyebrow">個案聯絡簿</div>
          <h2 class="private-heading">請選擇個案姓名</h2>
          <p style="margin:5px 0 0;color:var(--muted)">帳號就是下方顯示的學生名稱。點選姓名後，輸入學生、導師或家長的專屬密碼即可登入。</p>
          <div class="individual-grid">
            ${individuals.map(person => `
              <button type="button" class="individual-card" data-individual-unlock="${escapeAttr(person.id)}">
                <strong>${escapeHtml(person.name || person.id)}</strong>
                <span>${escapeHtml(getTeacherAssignmentSummary(person))}</span>
                <span class="lock-label">🔒 以此姓名登入</span>
              </button>`).join('')}
          </div>
        </section>`;
      els.content.querySelectorAll('[data-individual-unlock]').forEach(button => {
        button.addEventListener('click', () => {
          state.selectedIndividualId = button.dataset.individualUnlock;
          openPasswordModal('individual', button.dataset.individualUnlock);
        });
      });
    }

    function renderIndividualAdminPage(individuals) {
      const selected = getSelectedIndividual();
      if (!selected) return;
      const person = selected.person;
      els.content.innerHTML = `
        <div class="private-toolbar">
          <label class="field" style="min-width:min(360px,100%)">
            <span class="field-label">選擇個案</span>
            <select class="select" id="individualSelect">
              ${individuals.map(item => `<option value="${escapeAttr(item.id)}" ${item.id === person.id ? 'selected' : ''}>${escapeHtml(item.name || item.id)}</option>`).join('')}
            </select>
          </label>
          <button class="btn btn-soft" id="openStudentSettingsBtn" type="button">⚙ 管理學生名單</button>
        </div>
        ${renderIndividualEditor(person, selected.index)}`;

      bindDynamicInputs(els.content);
      bindQuickHomeworkControls(els.content);
      document.getElementById('individualSelect').addEventListener('change', event => {
        if (!confirmCommentContextChange()) {
          event.target.value = state.selectedIndividualId;
          return;
        }
        state.selectedIndividualId = event.target.value;
        renderAll();
      });
      document.getElementById('openStudentSettingsBtn').addEventListener('click', () => openUtility('settings'));
    }

    function getSelectedIndividual() {
      const activeIds = new Set(getStudentRoster().map(student => student.id));
      const individuals = Array.isArray(state.data && state.data.individuals) ? state.data.individuals : [];
      if (!individuals.length) return null;
      let index = individuals.findIndex(item => item.id === state.selectedIndividualId && activeIds.has(item.id));
      if (index < 0) index = individuals.findIndex(item => activeIds.has(item.id));
      if (index < 0) return null;
      state.selectedIndividualId = individuals[index].id;
      return { person: individuals[index], index };
    }

    function getGroupName(groupId) {
      return (getGroups().find(group => group.id === groupId) || { name: '未分組' }).name;
    }

    function getTeacherAssignmentSummary(person) {
      const schedule = getStudentSchedule(person && person.name);
      const dayCount = new Set(schedule.map(item => item.day)).size;
      return schedule.length ? `每週 ${schedule.length} 個課程時段・分布於 ${dayCount} 天` : '無排定潛能班課程';
    }

    function getIndividualRoleLabel(role) {
      return { viewer:'學生', homeroom:'導師', parent:'家長' }[role] || '學生';
    }

    function getTeacherRecords(person, teacherId) {
      const records = person && person.recordsByTeacher && person.recordsByTeacher[teacherId];
      if (Array.isArray(records)) return records;
      return teacherId === 'mary' && Array.isArray(person && person.records) ? person.records : [];
    }

    function getTeacherComments(person, teacherId) {
      const comments = person && person.commentsByTeacher && person.commentsByTeacher[teacherId];
      if (comments && typeof comments === 'object') return comments;
      return teacherId === 'mary' && person && person.comments ? person.comments : { specialTeacher:'', homeroom:'', parent:'' };
    }

    function hasRecordContent(record) {
      return Boolean(record && (
        [record.learning, record.teacherObservation].some(value => String(value || '').trim())
        || (Array.isArray(record.performanceTags) && record.performanceTags.length)
      ));
    }

    function hasPublicRecordContent(record) {
      return Boolean(record && (
        (Array.isArray(record.performanceTags) && record.performanceTags.length)
        || (record.showLearning && String(record.learning || '').trim())
        || (record.showTeacherObservation && String(record.teacherObservation || '').trim())
      ));
    }

    function renderIndividualRecordDay(person, index) {
      const date = state.data && state.data.days[index] ? parseISO(state.data.days[index].date) : null;
      const title = date ? `${weekdayName(index)}・${date.getMonth()+1} 月 ${date.getDate()} 日` : weekdayName(index);
      const blocks = TEACHERS.map(teacher => {
        const records = getTeacherRecords(person, teacher.id);
        const record = records[index] || {};
        return hasPublicRecordContent(record) ? { teacher, record } : null;
      }).filter(Boolean);
      const content = blocks.length
        ? blocks.map(({teacher, record}) => `<h4 class="teacher-record-heading">${escapeHtml(teacher.name)}・個別學習紀錄</h4>${renderRecordFields(record)}`).join('')
        : '<div class="value empty">尚未建立教師個別紀錄</div>';
      return `<article class="detail-card"><h3>${escapeHtml(title)}</h3>${content}</article>`;
    }

    function renderRecordFields(record) {
      const item = record || {};
      const tags = Array.isArray(item.performanceTags) ? item.performanceTags : [];
      const parts = [];
      if (tags.length) parts.push(`<div class="label">學習表現勾選</div><div class="chip-wrap">${tags.map(value => pill(value)).join('')}</div>`);
      if (item.showLearning && item.learning) parts.push(`<div class="label">學習表現文字紀錄</div>${textValue(item.learning)}`);
      if (item.showTeacherObservation && item.teacherObservation) parts.push(`<div class="label">特師觀察備註</div>${textValue(item.teacherObservation)}`);
      return parts.join('');
    }

    function getFamilyFeedback(person) {
      const source = person && person.familyFeedback && typeof person.familyFeedback === 'object' ? person.familyFeedback : {};
      return { homeroom: String(source.homeroom || ''), parent: String(source.parent || ''), updatedAt: String(source.updatedAt || '') };
    }

    function createCommentEntry(role, content, author, teacherId = '', options = {}) {
      const now = new Date();
      const action = ['create','edit','delete'].includes(options.action) ? options.action : 'create';
      return {
        id: `${action === 'create' ? 'msg' : 'evt'}-${now.getTime()}-${Math.random().toString(36).slice(2,8)}`,
        action,
        targetId: action === 'create' ? '' : String(options.targetId || ''),
        role: String(role || ''),
        author: String(author || ''),
        teacherId: String(teacherId || ''),
        createdAt: now.toISOString(),
        date: toISO(now),
        content: action === 'delete' ? '' : String(content || '').trim()
      };
    }

    function appendCommentEntry(existing, entry) {
      const current = String(existing || '').trim();
      const serialized = COMMENT_ENTRY_PREFIX + JSON.stringify(entry || {});
      return current ? current + '\n' + serialized : serialized;
    }

    function parseCommentEvents(value, defaults = {}) {
      const source = String(value || '');
      if (!source.trim()) return [];
      const events = [];
      const legacyLines = [];
      source.split(/\r?\n/).forEach(line => {
        if (line.startsWith(COMMENT_ENTRY_PREFIX)) {
          try {
            const parsed = JSON.parse(line.slice(COMMENT_ENTRY_PREFIX.length));
            const action = ['create','edit','delete'].includes(parsed && parsed.action) ? parsed.action : 'create';
            const content = String(parsed && parsed.content || '').trim();
            const targetId = String(parsed && parsed.targetId || '');
            const valid = action === 'create' ? Boolean(content)
              : action === 'edit' ? Boolean(targetId && content)
                : Boolean(targetId);
            if (valid) {
              events.push({
                id: String(parsed.id || `${action === 'create' ? 'msg' : 'evt'}-${events.length + 1}`),
                action,
                targetId,
                role: String(defaults.role || ''),
                author: String(defaults.author || ''),
                teacherId: String(defaults.teacherId || ''),
                createdAt: String(parsed.createdAt || ''),
                date: /^\d{4}-\d{2}-\d{2}$/.test(String(parsed.date || '')) ? String(parsed.date) : '',
                content
              });
              return;
            }
          } catch (error) { /* 非系統格式時保留為既有留言 */ }
        }
        legacyLines.push(line);
      });
      const legacyContent = legacyLines.join('\n').trim();
      if (legacyContent) {
        events.unshift({
          id: `legacy-${defaults.role || 'message'}-${defaults.teacherId || 'general'}`,
          action: 'create',
          targetId: '',
          role: String(defaults.role || ''),
          author: String(defaults.author || ''),
          teacherId: String(defaults.teacherId || ''),
          createdAt: '',
          date: '',
          content: legacyContent,
          legacy: true
        });
      }
      return events;
    }

    function projectCommentEvents(events) {
      const messages = [];
      const byId = new Map();
      (events || []).forEach(event => {
        if (event.action === 'create') {
          if (!event.id || byId.has(event.id)) return;
          const message = {
            ...event,
            history:[{ ...event }],
            deleted:false,
            editedAt:'',
            deletedAt:'',
            lastActivityAt:event.createdAt || ''
          };
          byId.set(message.id, message);
          messages.push(message);
          return;
        }
        const target = byId.get(event.targetId);
        if (!target || target.deleted) return;
        const historyEvent = { ...event, previousContent:target.content };
        target.history.push(historyEvent);
        target.lastActivityAt = event.createdAt || target.lastActivityAt;
        if (event.action === 'edit') {
          target.content = event.content;
          target.editedAt = event.createdAt || '';
        }
        if (event.action === 'delete') {
          target.deleted = true;
          target.deletedAt = event.createdAt || '';
        }
      });
      return messages;
    }

    function parseCommentEntries(value, defaults = {}, options = {}) {
      const messages = projectCommentEvents(parseCommentEvents(value, defaults));
      return options.includeDeleted ? messages : messages.filter(message => !message.deleted);
    }

    function appendCommentMutation(existing, defaults, action = 'create', targetId = '', content = '') {
      const normalizedAction = ['create','edit','delete'].includes(action) ? action : 'create';
      const text = String(content || '').trim();
      if (normalizedAction !== 'delete' && !text) throw new Error('留言內容不可空白。');
      if (text.length > 2000) throw new Error('單則留言不可超過 2000 個字元。');
      if (normalizedAction !== 'create') {
        const target = parseCommentEntries(existing, defaults, { includeDeleted:true })
          .find(message => message.id === targetId && !message.deleted);
        if (!target) throw new Error('找不到可修改的原留言。');
      }
      const entry = createCommentEntry(
        defaults.role,
        normalizedAction === 'delete' ? '' : text,
        defaults.author,
        defaults.teacherId || '',
        { action:normalizedAction, targetId }
      );
      return appendCommentEntry(existing, entry);
    }

    function getIndividualCommentMessages(person, fallbackComments = {}, options = {}) {
      const messages = [];
      let hasTeacherSource = false;
      TEACHERS.forEach(teacher => {
        const comments = getTeacherComments(person, teacher.id);
        if (String(comments.specialTeacher || '').trim()) hasTeacherSource = true;
        messages.push(...parseCommentEntries(comments.specialTeacher, {
          role:'teacher', author:teacher.name, teacherId:teacher.id
        }, options));
      });
      if (!hasTeacherSource) {
        messages.push(...parseCommentEntries(fallbackComments && fallbackComments.specialTeacher, {
          role:'teacher', author:'特教教師', teacherId:'legacy'
        }, options));
      }
      const family = getFamilyFeedback(person);
      messages.push(...parseCommentEntries(family.homeroom, { role:'homeroom', author:'導師' }, options));
      messages.push(...parseCommentEntries(family.parent, { role:'parent', author:'家長' }, options));
      return messages.map((message, index) => ({ ...message, sequence:index })).sort((a,b) => {
        const parsedATime = a.lastActivityAt ? Date.parse(a.lastActivityAt) : Number.NaN;
        const parsedBTime = b.lastActivityAt ? Date.parse(b.lastActivityAt) : Number.NaN;
        const aTime = Number.isNaN(parsedATime) ? Number.NEGATIVE_INFINITY : parsedATime;
        const bTime = Number.isNaN(parsedBTime) ? Number.NEGATIVE_INFINITY : parsedBTime;
        if (aTime !== bTime) return aTime - bTime;
        return a.sequence - b.sequence;
      });
    }

    function getCommentRoleLabel(role) {
      return { teacher:'特教教師', homeroom:'導師', parent:'家長' }[role] || '師長';
    }

    function formatCommentTimestamp(message) {
      if (!message || !message.createdAt) return '既有留言';
      const date = new Date(message.createdAt);
      if (Number.isNaN(date.getTime())) return message.date || '既有留言';
      return new Intl.DateTimeFormat('zh-TW', {
        month:'numeric', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false
      }).format(date);
    }

    function formatCommentActivity(message) {
      if (message && message.deletedAt) return `${formatCommentTimestamp({ createdAt:message.deletedAt, date:message.date })}・已刪除`;
      if (message && message.editedAt) return `${formatCommentTimestamp({ createdAt:message.editedAt, date:message.date })}・已編輯`;
      return formatCommentTimestamp(message);
    }

    function getCommentActionLabel(action, legacy = false) {
      if (legacy) return '既有留言';
      return { create:'新增', edit:'編輯', delete:'刪除' }[action] || '異動';
    }

    function renderCommentAuditHistory(message) {
      const history = Array.isArray(message.history) ? message.history : [];
      if (history.length <= 1 && !message.deleted) return '';
      return `<details class="comment-audit-history">
        <summary>完整異動紀錄・${history.length} 筆</summary>
        <ol class="comment-audit-list">
          ${history.map(event => {
            const content = event.action === 'delete'
              ? `刪除前內容：${event.previousContent || message.content || ''}`
              : event.content;
            return `<li class="comment-audit-event">
              <strong>${escapeHtml(getCommentActionLabel(event.action, event.legacy))}</strong>
              <span>${escapeHtml(formatCommentTimestamp(event))}</span>
              <div>${escapeHtml(content || '此留言已刪除')}</div>
            </li>`;
          }).join('')}
        </ol>
      </details>`;
    }

    function renderCommentThread(messages, emptyText = '本週尚無留言', options = {}) {
      const auditMode = Boolean(options.auditMode);
      const visibleMessages = auditMode ? messages : messages.filter(message => !message.deleted);
      if (!visibleMessages.length) return `<div class="empty-state">${escapeHtml(emptyText)}</div>`;
      const note = auditMode
        ? '教師完整紀錄會保留每次新增、編輯與刪除；其他角色只會看到最新結果。'
        : '最新留言顯示在上方；編輯後只呈現最新版，刪除後不再顯示。';
      return `<p class="comment-thread-note">${escapeHtml(note)}</p>
        <div class="comment-thread">
          ${[...visibleMessages].reverse().map(message => {
            const teacherEditable = options.context === 'teacher'
              && message.role === 'teacher'
              && message.teacherId === options.editableTeacherId;
            const familyEditable = options.context === 'family'
              && message.role === options.editableRole;
            const canEdit = !message.deleted && (teacherEditable || familyEditable);
            const editState = state.commentEdit;
            const isEditing = canEdit && editState
              && editState.messageId === message.id
              && editState.personIndex === options.personIndex
              && editState.context === options.context;
            return `
            <article class="comment-thread-message ${escapeAttr(message.role)} ${message.deleted ? 'is-deleted' : ''}">
              <div class="comment-thread-meta">
                <strong>${escapeHtml(message.author || getCommentRoleLabel(message.role))}</strong>
                <span class="comment-thread-role">${escapeHtml(getCommentRoleLabel(message.role))}</span>
                <span class="comment-thread-time">${escapeHtml(formatCommentActivity(message))}</span>
              </div>
              <div class="comment-thread-content">${message.deleted
                ? `<strong>此留言已由作者刪除</strong>\n刪除前最後內容：${escapeHtml(message.content)}`
                : escapeHtml(message.content)}</div>
              ${isEditing ? `<div class="comment-edit-form">
                <textarea class="textarea" data-comment-edit-draft maxlength="2000">${escapeHtml(editState.content)}</textarea>
                <div class="comment-message-actions">
                  <button class="btn" type="button" data-cancel-comment-edit>取消</button>
                  <button class="btn btn-primary" type="button" data-save-comment-edit>儲存修改</button>
                </div>
              </div>` : canEdit ? `<div class="comment-message-actions">
                <button class="btn btn-soft" type="button" data-edit-comment data-comment-id="${escapeAttr(message.id)}" data-person-index="${options.personIndex}" data-comment-context="${escapeAttr(options.context || '')}" data-teacher-id="${escapeAttr(options.editableTeacherId || '')}">✎ 編輯</button>
                <button class="btn btn-danger" type="button" data-delete-comment data-comment-id="${escapeAttr(message.id)}" data-person-index="${options.personIndex}" data-comment-context="${escapeAttr(options.context || '')}" data-teacher-id="${escapeAttr(options.editableTeacherId || '')}">刪除</button>
              </div>` : ''}
              ${auditMode ? renderCommentAuditHistory(message) : ''}
            </article>`;
          }).join('')}
        </div>`;
    }

    function renderIndividualComments(person, personIndex) {
      const fallback = state.data.comments || {};
      const family = getFamilyFeedback(person);
      const messages = getIndividualCommentMessages(person, fallback);
      const role = state.individualRole;
      const editableRole = role === 'homeroom' || role === 'parent' ? role : '';
      const editableLabel = getIndividualRoleLabel(editableRole);
      const messageCount = messages.length;
      const messageSummary = messageCount
        ? `本週有 ${messageCount} 則留言・已自動展開`
        : '本週尚無留言・點擊展開新增或查看';
      return `<details class="comments-card teacher-record-accordion individual-comments-accordion" ${messageCount ? 'open' : ''}>
        <summary>
          <span class="teacher-record-summary-copy">
            <strong>特教教師與師長留言串</strong>
            <span>${messageSummary}</span>
          </span>
        </summary>
        <div class="teacher-record-accordion-body">
          ${renderCommentThread(messages, '本週尚無留言', {
            context:'family', editableRole, personIndex
          })}
          ${editableRole ? `<div class="comment-compose">
            <h3>新增${escapeHtml(editableLabel)}留言</h3>
            <p>每次新增都會保留原留言，並自動標示日期與時間。</p>
            <textarea class="textarea large" data-feedback-draft maxlength="2000" placeholder="輸入本次想新增的留言">${escapeHtml(state.feedbackDraft)}</textarea>
            <div class="comment-compose-actions">
              <span class="badge ${state.feedbackDirty ? 'badge-orange' : 'badge-green'}" id="feedbackStatus">${state.feedbackDirty ? '留言尚未儲存' : (family.updatedAt ? '留言已儲存' : '尚未填寫留言')}</span>

    function renderDayCard(day, index, scope = 'all', options = {}) {
      const privateView = Boolean(options.privateView);
      const allowedScopes = Array.isArray(options.allowedScopes) ? options.allowedScopes : null;
      const scheduleEntries = Array.isArray(options.scheduleEntries) ? options.scheduleEntries : [];
      const date = parseISO(day.date);
      const wide = state.viewMode === 'week' && index === 4 ? 'wide' : '';
      const disabledClass = day.enabled ? '' : 'is-disabled';

      if (!day.enabled) {
        return `
          <article class="day-card ${wide} is-disabled">
            <header class="day-header"><div><h2>${weekdayName(index)}</h2><div class="date">${date.getMonth()+1} 月 ${date.getDate()} 日</div></div></header>
            <div class="day-body">${renderHolidayNote(day)}<div class="empty-state">本日不上課／無聯絡事項</div></div>
          </article>`;
      }

      const sections = allowedScopes ? renderSectionsForAllowedScopes(day, allowedScopes, privateView, scheduleEntries) : renderSectionsForScope(day, scope, privateView, scheduleEntries);
      const hasMeaningful = allowedScopes
        ? allowedScopes.some(allowedScope => dayHasContent(day, allowedScope, privateView, scheduleEntries))
        : dayHasContent(day, scope, privateView, scheduleEntries);
      const scheduleSummary = scheduleEntries.length
        ? `<div class="selected-class-banner"><strong>今日固定課表</strong><span>${scheduleEntries.map(item => `${item.slot}・${getScheduleDisplayTitle(item)}・${getTeacher(item.teacherId).name}`).join('｜')}</span></div>`
        : '';
      const emptyText = allowedScopes && !allowedScopes.length ? '無排定潛能班課程' : '本節尚無教學或功課紀錄';

      return `
        <article class="day-card ${wide}">
          <header class="day-header">
            <div><h2>${weekdayName(index)}</h2><div class="date">${date.getFullYear()} 年 ${date.getMonth()+1} 月 ${date.getDate()} 日</div></div>
            ${privateView && day.common.points ? '<span class="badge badge-orange">⭐ ' + escapeHtml(day.common.points) + ' 點</span>' : ''}
          </header>
          <div class="day-body">${renderHolidayNote(day)}${scheduleSummary}${hasMeaningful ? sections.join('') : `<div class="empty-state">${emptyText}</div>`}</div>
        </article>`;
    }

    function renderHolidayNote(day) {
      return day.holidayNote ? `<div class="holiday-note" role="note">${escapeHtml(day.holidayNote)}</div>` : '';
    }

    function renderSectionsForScope(day, scope, privateView, scheduleEntries = []) {
      const viewDay = getStudentViewDay(day, scheduleEntries);
      const sections = [];
      if (scope === 'chinese') {
        if (viewDay.generalEnabled) sections.push(renderViewChinese(viewDay));
        return sections;
      }
      if (scope === 'math') {
        if (viewDay.generalEnabled) sections.push(renderViewMath(viewDay));
        return sections;
      }
      if (scope === 'special') {
        if (viewDay.specialEnabled) sections.push(renderViewSpecial(viewDay));
        return sections;
      }
      if (viewDay.generalEnabled) sections.push(renderViewGeneral(viewDay));
      if (viewDay.specialEnabled) sections.push(renderViewSpecial(viewDay));
      if (privateView) sections.push(renderViewCommon(viewDay));
      return sections.filter(Boolean);
    }

    function renderSectionsForAllowedScopes(day, scopes, privateView, scheduleEntries = []) {
      const viewDay = getStudentViewDay(day, scheduleEntries);
      const allowed = new Set(scopes || []);
      const sections = [];
      if (allowed.has('chinese') && viewDay.generalEnabled) sections.push(renderViewChinese(viewDay));
      if (allowed.has('math') && viewDay.generalEnabled) sections.push(renderViewMath(viewDay));
      if (allowed.has('special') && viewDay.specialEnabled) sections.push(renderViewSpecial(viewDay));
      if (privateView && allowed.size) sections.push(renderViewCommon(viewDay));
      return sections.filter(Boolean);
    }

    function getStudentViewDay(day, scheduleEntries = []) {
      const view = deepClone(day || createEmptyDayClient(''));
      const courses = scheduleEntries.length
        ? scheduleEntries.map(entry => ({ teacher:getTeacher(entry.teacherId), course:getScheduleCourseSet(day, entry) }))
        : TEACHERS.map(teacher => ({ teacher, course:getTeacherCourseSet(day, teacher.id) }));
      const chinese = courses.map(item => ({ ...item.course.chinese, teacher:item.teacher })).filter(hasChineseCourseContent);
      const math = courses.map(item => ({ ...item.course.math, teacher:item.teacher })).filter(hasMathCourseContent);
      const special = courses.map(item => ({ ...item.course.special, teacher:item.teacher })).filter(hasSpecialCourseContent);
      if (chinese.length || math.length) view.generalEnabled = true;
      if (special.length) view.specialEnabled = true;
      if (chinese.length) {
        view.general.chineseLesson = combineTeacherValues(chinese, 'lesson');
        view.general.chineseOther = combineTeacherValues(chinese, 'other');
        view.general.chineseHomework = combineTeacherValues(chinese, 'homework');
        view.general.chineseTopics = uniqueValues(chinese.flatMap(item => Array.isArray(item.topics) ? item.topics : []));
      }
      if (math.length) {
        view.general.mathUnit = combineTeacherValues(math, 'unit');
        view.general.mathContent = combineTeacherValues(math, 'content');
        view.general.mathHomework = combineTeacherValues(math, 'homework');
      }
      if (special.length) {
        view.special.subject = combineTeacherValues(special, 'subject');
        view.special.otherCategory = combineTeacherValues(special, 'otherCategory');
        view.special.content = combineTeacherValues(special, 'content');
        view.special.homework = combineTeacherValues(special, 'homework');
        view.special.categories = uniqueValues(special.flatMap(item => Array.isArray(item.categories) ? item.categories : []));
      }
      return view;
    }

    function combineTeacherValues(items, key) {
      const values = items.map(item => ({ value: String(item[key] || '').trim(), teacher: item.teacher ? item.teacher.name : '' })).filter(item => item.value);
      const unique = uniqueValues(values.map(item => item.value));
      if (unique.length <= 1) return unique[0] || '';
      return values.map(item => `${item.teacher}：${item.value}`).join('；');
    }

    function uniqueValues(values) {
      return Array.from(new Set(values.filter(value => value != null && String(value).trim()).map(value => String(value).trim())));
    }

    function hasChineseCourseContent(course) {
      return Boolean(course && (course.lesson || course.other || course.homework || (course.topics || []).length));
    }

    function hasMathCourseContent(course) {
      return Boolean(course && (course.unit || course.content || course.homework));
    }

    function hasSpecialCourseContent(course) {
      return Boolean(course && course.content);
    }

        <label class="check-chip"><input type="checkbox" data-array="${escapeAttr(path)}" value="${escapeAttr(option)}" ${selected.includes(option) ? 'checked' : ''}><span>${escapeHtml(option)}</span></label>`).join('')}</div>`;
    }

    function renderEditingControls() {
      els.editBtn.hidden = state.editing;
      els.leaveEditBtn.hidden = !state.editing;
      els.exportCenterBtn.hidden = !state.editing;
      els.settingsCenterBtn.hidden = !state.editing;
      els.savingBar.classList.toggle('show', state.editing);
      els.dirtyText.textContent = state.dirty ? '尚未儲存' : '已同步';
      els.dirtyText.className = 'badge ' + (state.dirty ? 'badge-orange' : 'badge-green');
      els.saveBtn.disabled = !state.dirty;
    }

    function bindDynamicInputs(root) {
      root.querySelectorAll('[data-bind]').forEach(input => {
        const updateValue = event => {
          const path = event.currentTarget.dataset.bind;
          const value = event.currentTarget.value;
          setPath(state.data, path, value);
          const rosterMatch = path.match(/^individuals\.(\d+)\.(name|password)$/);
          if (rosterMatch) {
            const person = state.data.individuals[Number(rosterMatch[1])];
            const rosterItem = person && state.appConfig.students.find(student => student.id === person.id);
            if (rosterItem) {
              const field = rosterMatch[2];
              const oldName = rosterItem.name;
              rosterItem[field] = value;
              if (field === 'name' && oldName !== value) {
                Object.values(state.appConfig.schedules || {}).forEach(byTeacher => TEACHERS.forEach(teacher => {
                  (byTeacher[teacher.id] || []).forEach(entry => { entry.students = (entry.students || []).map(name => name === oldName ? value : name); });
                }));
              }
              state.appConfig.updatedAt = new Date().toISOString();
              state.data.appConfig = deepClone(state.appConfig);
            }
          }
          markDirty();
        };
        input.addEventListener('input', updateValue);
        if (input.tagName === 'SELECT') input.addEventListener('change', updateValue);
      });

      root.querySelectorAll('[data-array]').forEach(input => {
        input.addEventListener('change', event => {
          const path = event.currentTarget.dataset.array;
          const current = getPath(state.data, path);
          const next = Array.isArray(current) ? [...current] : [];
          const value = event.currentTarget.value;
          const index = next.indexOf(value);
          if (event.currentTarget.checked && index === -1) next.push(value);
          if (!event.currentTarget.checked && index !== -1) next.splice(index, 1);
          setPath(state.data, path, next);
          markDirty();
        });
      });

      root.querySelectorAll('[data-bool]').forEach(input => {
        input.addEventListener('change', event => {
          setPath(state.data, event.currentTarget.dataset.bool, event.currentTarget.checked);
          markDirty();
          renderAll();
        });
      });
    }

    function bindIndividualFeedbackInputs(root) {
      const input = root.querySelector('[data-feedback-draft]');
      const saveButton = document.getElementById('saveIndividualFeedbackBtn');

    function confirmCommentContextChange() {
      if (!state.commentEdit) return true;
      if (!confirm('目前的留言修改尚未儲存，確定要切換嗎？')) return false;
      state.commentEdit = null;

    function bindCommentThreadControls(root) {
      root.querySelectorAll('[data-add-teacher-comment]').forEach(button => {
        button.addEventListener('click', () => {
          const composer = button.closest('.comment-compose');
          const input = composer ? composer.querySelector('[data-teacher-comment-draft]') : null;
          const content = String(input ? input.value : '').trim();
          if (!content) {
            showToast('請先輸入留言內容', true);
            if (input) input.focus();

          }

          try {
            setPath(
              state.data,
              `individuals.${personIndex}.commentsByTeacher.${teacherId}.specialTeacher`,
              appendCommentMutation(
                comments.specialTeacher,
                { role:'teacher', author:teacher.name, teacherId },
                'create',
                '',
                content
              )
            );

            showToast(error.message || '留言新增失敗', true);
            return;

          markDirty();
          renderAll();
          showToast('留言已加入；請再按「儲存本週」完成同步');
        });
      });

      root.querySelectorAll('[data-edit-comment]').forEach(button => {
        button.addEventListener('click', () => {
          if (state.feedbackDirty) {
            showToast('請先新增或清除目前尚未儲存的留言', true);
            return;
          }
          const target = getCommentActionTarget(button);
          if (!target || !canCurrentRoleMutateComment(target)) {
            showToast('只能編輯自己新增的留言', true);
            return;
          }
          state.commentEdit = {
            context:target.context,
            personIndex:target.personIndex,

            messageId:target.message.id,

        });

        input.addEventListener('input', event => {

        });

      root.querySelectorAll('[data-cancel-comment-edit]').forEach(button => {
        button.addEventListener('click', () => {
          state.commentEdit = null;
          renderAll();
        });
      });

      root.querySelectorAll('[data-save-comment-edit]').forEach(button => {
        button.addEventListener('click', async () => {
          const edit = state.commentEdit;
          const content = String(edit && edit.content || '').trim();
          if (!edit || !content) {
            showToast('留言內容不可空白', true);
            return;
          }
          if (edit.context === 'teacher') {
            applyTeacherCommentMutation(edit, 'edit');
          } else {
            await saveFamilyCommentMutation(edit, 'edit', button);
          }
        });
      });

      root.querySelectorAll('[data-delete-comment]').forEach(button => {
        button.addEventListener('click', async () => {
          if (state.feedbackDirty) {
            showToast('請先新增或清除目前尚未儲存的留言', true);
            return;
          }
          const target = getCommentActionTarget(button);
          if (!target || !canCurrentRoleMutateComment(target)) {
            showToast('只能刪除自己新增的留言', true);
            return;
          }
          if (!confirm('刪除後，學生、導師與家長將看不到這則留言；特教教師端仍會保留刪除紀錄。確定刪除嗎？')) return;
          const edit = {
            context:target.context,
            personIndex:target.personIndex,
            teacherId:target.teacherId,
            messageId:target.message.id,
            content:target.message.content
          };
          if (target.context === 'teacher') {
            applyTeacherCommentMutation(edit, 'delete');
          } else {
            await saveFamilyCommentMutation(edit, 'delete', button);
          }
        });

    function getCommentActionTarget(button) {
      const personIndex = Number(button.dataset.personIndex);
      const context = String(button.dataset.commentContext || '');
      const teacherId = String(button.dataset.teacherId || '');
      const messageId = String(button.dataset.commentId || '');
      const person = state.data && state.data.individuals && state.data.individuals[personIndex];
      if (!person || !messageId || !['teacher','family'].includes(context)) return null;
      const message = getIndividualCommentMessages(
        person,
        state.data.comments || {},
        { includeDeleted:true }
      ).find(item => item.id === messageId);
      return message ? { person, personIndex, context, teacherId, message } : null;
    }

    function canCurrentRoleMutateComment(target) {
      if (!target || target.message.deleted) return false;
      if (target.context === 'teacher') {
        return state.editing
          && target.message.role === 'teacher'
          && target.message.teacherId === target.teacherId
          && target.teacherId === state.teacherId;
      }
      return ['homeroom','parent'].includes(state.individualRole)
        && target.message.role === state.individualRole;
    }

    function applyTeacherCommentMutation(edit, action) {
      const person = state.data.individuals[edit.personIndex];
      const teacher = TEACHERS.find(item => item.id === edit.teacherId);
      if (!person || !teacher || !['edit','delete'].includes(action)) return;
      const comments = getTeacherComments(person, teacher.id);
      const target = parseCommentEntries(
        comments.specialTeacher,
        { role:'teacher', author:teacher.name, teacherId:teacher.id },
        { includeDeleted:true }
      ).find(message => message.id === edit.messageId && !message.deleted);
      if (!target) {
        showToast('找不到可修改的原留言', true);
        return;
      }
      try {
        setPath(
          state.data,
          `individuals.${edit.personIndex}.commentsByTeacher.${teacher.id}.specialTeacher`,
          appendCommentMutation(
            comments.specialTeacher,
            { role:'teacher', author:teacher.name, teacherId:teacher.id },
            action,
            target.id,
            action === 'delete' ? '' : edit.content
          )
        );
      } catch (error) {
        showToast(error.message || '留言異動失敗', true);
        return;
      }
      state.commentEdit = null;
      state.teacherStudentRecordsOpen = true;
      markDirty();
      renderAll();
      showToast(action === 'delete'
        ? '刪除已加入；請再按「儲存本週」完成同步'
        : '修改已加入；請再按「儲存本週」完成同步');
    }

    async function saveFamilyCommentMutation(edit, action, button) {
      const person = getIndividualById(state.unlockedIndividualId);
      const role = state.individualRole;
      if (!person || !state.individualPassword || !['homeroom','parent'].includes(role)) return;
      button.disabled = true;
      button.textContent = action === 'delete' ? '刪除中…' : '儲存中…';
      try {
        const result = await callBackend(
          'saveIndividualFeedback',
          state.individualPassword,
          person.id,
          state.weekStart,
          role,
          action === 'delete' ? '' : edit.content,
          action,
          edit.messageId
        );
        adoptIndividualFeedbackResult(result);
        state.commentEdit = null;
        state.feedbackDirty = false;
        state.feedbackDraft = '';
        renderAll();
        showToast(action === 'delete'
          ? `${getIndividualRoleLabel(role)}留言已刪除`
          : `${getIndividualRoleLabel(role)}留言已更新`);
      } catch (error) {
        console.error(error);
        showToast(error.message || '留言異動失敗', true);
        button.disabled = false;
        button.textContent = action === 'delete' ? '刪除' : '儲存修改';
      }
    }

    function bindQuickHomeworkControls(root) {
      root.querySelectorAll('[data-quick-homework-add]').forEach(button => {
        button.addEventListener('click', () => {
          const path = button.dataset.quickHomeworkAdd;
          const value = String(button.dataset.quickHomeworkValue || '').trim();
          if (!path || !value) return;
          const current = String(getPath(state.data, path + '.homework') || '').trim();
          const existing = current.split(/\r?\n/).map(item => item.trim()).filter(Boolean);
          if (existing.includes(value)) {
            showToast(`「${value}」已在每日功課中`);
            return;
          }
          const next = current ? current + '\n' + value : value;
          setPath(state.data, path + '.homework', next);
          const textarea = root.querySelector(`[data-bind="${path}.homework"]`);
          if (textarea) textarea.value = next;
          markDirty();
          showToast(`已加入「${value}」`);
        });
      });

      root.querySelectorAll('[data-save-quick-homework]').forEach(button => {

          const path = button.dataset.saveQuickHomework;
          const editor = Array.from(root.querySelectorAll('[data-quick-homework-settings]'))

        return Array.isArray(items) ? uniqueValues(items).slice(0, 20) : [...DEFAULT_QUICK_HOMEWORK_ITEMS];
      } catch (error) {
        return [...DEFAULT_QUICK_HOMEWORK_ITEMS];

      getStorageAdapter().setItem(QUICK_HOMEWORK_STORAGE_KEY, JSON.stringify(items || []));
