<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安東潛能班線上聯絡簿</title>
  <style>
    :root {
      --bg: #f5f3ea;
      --paper: #fffef9;
      --ink: #263238;
      --muted: #687477;
      --line: #d9dfd8;
      --primary: #327b6b;
      --primary-soft: #e2f1ed;
      --accent: #ef9f5b;
      --accent-soft: #fff0df;
      --blue-soft: #eaf2fb;
      --danger: #b54747;
      --shadow: 0 12px 34px rgba(56, 75, 69, .10);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #fff9e8 0, transparent 30%),
        radial-gradient(circle at 100% 15%, #e8f5f2 0, transparent 31%),
        var(--bg);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .app-shell { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 254, 249, .92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(126, 145, 139, .22);
    }
    .topbar-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 230px; }
    .brand-icon {
      width: 46px; height: 46px; border-radius: 15px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, var(--primary), #4b9b88);
      color: white; font-size: 24px; box-shadow: var(--shadow);
    }
    .brand h1 { margin: 0; font-size: clamp(1.08rem, 2.5vw, 1.45rem); line-height: 1.25; }
    .brand small { display: block; color: var(--muted); font-weight: 500; margin-top: 2px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 9px 13px;
      border-radius: 12px;
      font-weight: 700;
      transition: .16s ease;
      min-height: 42px;
    }
    .btn:hover { transform: translateY(-1px); border-color: #9fb6af; }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-accent { background: var(--accent); color: #392514; border-color: var(--accent); }
    .btn-soft { background: var(--primary-soft); border-color: #bfdad2; color: #235d50; }
    .btn-danger { color: var(--danger); border-color: #e4bcbc; background: #fff8f8; }
    .btn-icon { width: 42px; padding: 0; display: grid; place-items: center; font-size: 1.1rem; }

    .page { width: 100%; max-width: 1600px; margin: 0 auto; padding: 24px 20px 52px; }
    .hero {
      background: var(--paper);
      border: 1px solid rgba(148, 164, 158, .3);
      border-radius: 26px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .hero-grid { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: start; }
    .eyebrow { color: var(--primary); font-weight: 800; letter-spacing: .08em; font-size: .82rem; }
    .week-title { margin: 4px 0 4px; font-size: clamp(1.55rem, 5vw, 2.4rem); line-height: 1.25; }
    .week-range { color: var(--muted); font-weight: 700; }
    .notice-box {
      margin-top: 14px; padding: 12px 14px; border-radius: 14px;
      background: var(--accent-soft); border-left: 4px solid var(--accent);
      white-space: pre-wrap;
    }
    .status-stack { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px;
      font-size: .82rem; font-weight: 800; background: #f0f3f2; color: #50605c;
    }
    .badge-green { background: var(--primary-soft); color: #236253; }
    .badge-orange { background: var(--accent-soft); color: #8c531e; }

    .control-panel {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .week-nav, .view-switch, .day-tabs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .week-select {
      min-width: 218px; min-height: 42px; padding: 8px 12px;
      background: white; border: 1px solid var(--line); border-radius: 12px; font-weight: 700;
    }
    .segmented {
      display: inline-flex; background: #e9ecea; padding: 4px; border-radius: 13px;
    }
    .segmented button { border: 0; background: transparent; border-radius: 10px; padding: 8px 14px; font-weight: 800; }
    .segmented button.active { background: white; box-shadow: 0 3px 10px rgba(40, 60, 53, .12); color: var(--primary); }

    .page-tabs {
      display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px;
      padding: 5px; background: rgba(233, 236, 234, .86); border-radius: 15px;
    }
    .page-tab {
      flex: 1 1 220px; border: 0; background: transparent; border-radius: 11px;
      padding: 10px 14px; color: var(--muted); font-weight: 900;
    }
    .page-tab.active { background: white; color: var(--primary); box-shadow: 0 3px 10px rgba(40, 60, 53, .12); }

    .group-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .group-card {
      border: 1px solid var(--line); background: white; border-radius: 14px; padding: 13px;
      text-align: left; color: var(--ink); min-height: 92px; transition: .16s ease;
    }
    .group-card:hover { transform: translateY(-1px); border-color: #9fb6af; }
    .group-card.active { border: 2px solid var(--primary); background: var(--primary-soft); padding: 12px; }
    .group-card strong { display: block; font-size: 1rem; }
    .group-card span { display: block; margin-top: 4px; color: var(--muted); font-size: .82rem; line-height: 1.45; }

    .holiday-note {
      margin: -2px 0 2px; padding: 12px 14px; border: 2px solid #e8a4a4;
      border-radius: 14px; background: #fff1f1; color: #b12626; text-align: center;
      font-size: clamp(1.3rem, 4vw, 2rem); font-weight: 950; line-height: 1.3;
    }
    .holiday-input { margin-top: 9px; border-color: #e8baba; background: #fff8f8; }
    .holiday-label { display: block; color: #a13d3d; font-size: .82rem; font-weight: 900; }

    .locked-card, .private-panel {
      background: var(--paper); border: 1px solid rgba(148,164,158,.32);
      border-radius: var(--radius); padding: 22px; box-shadow: 0 8px 25px rgba(56,75,69,.07);
    }
    .locked-card { text-align: center; padding: 42px 20px; }
    .locked-card h2 { margin: 0 0 8px; }
    .locked-card p { max-width: 560px; margin: 0 auto 18px; color: var(--muted); }
    .private-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .private-toolbar .select { max-width: 360px; }
    .private-heading { margin: 0; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr)); gap: 12px; }
    .detail-card { min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: white; }
    .detail-card h3 { margin: 0 0 8px; font-size: 1rem; }
    .detail-card .label { margin-top: 9px; }
    .individual-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .individual-card {
      border: 1px solid var(--line); background: white; border-radius: 16px; padding: 17px;
      color: var(--ink); text-align: left; min-height: 116px; transition: .16s ease;
    }
    .individual-card:hover { transform: translateY(-1px); border-color: #9fb6af; box-shadow: 0 8px 20px rgba(56,75,69,.08); }
    .individual-card strong { display: block; font-size: 1.08rem; }
    .individual-card span { display: block; margin-top: 7px; color: var(--muted); font-size: .86rem; }
    .individual-card .lock-label { margin-top: 12px; color: var(--primary); font-size: .82rem; font-weight: 900; }
    .case-account-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 8px; align-items: start; }
    .case-password-field { min-width: 0; }
    .case-password-help { grid-column: 1 / -1; margin: -2px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .password-reset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .password-reset-card { border: 1px solid var(--line); border-radius: 13px; padding: 12px; background: #fbfdff; }
    .password-reset-card strong, .password-reset-card span { display: block; }
    .password-reset-card span { margin: 6px 0 10px; color: var(--muted); font-size: .82rem; line-height: 1.45; }
    .password-reset-result { margin-top: 8px !important; color: var(--primary) !important; font-weight: 900; overflow-wrap: anywhere; }
    .teacher-record-accordion { margin-top: 18px; padding: 0; overflow: hidden; }
    .teacher-record-accordion > summary {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 18px 22px; cursor: pointer; list-style: none; user-select: none;
    }
    .teacher-record-accordion > summary::-webkit-details-marker { display: none; }
    .teacher-record-accordion > summary::after { content: '＋'; flex: 0 0 auto; color: var(--muted); font-size: 1.35rem; font-weight: 900; }
    .teacher-record-accordion[open] > summary { border-bottom: 1px solid var(--line); background: var(--primary-soft); }
    .teacher-record-accordion[open] > summary::after { content: '−'; }
    .teacher-record-summary-copy strong, .teacher-record-summary-copy span { display: block; }
    .teacher-record-summary-copy strong { color: var(--primary); font-size: 1.13rem; }
    .teacher-record-summary-copy span { margin-top: 4px; color: var(--muted); font-size: .84rem; font-weight: 650; }
    .teacher-record-accordion-body { padding: 18px 22px 22px; }
    .private-panel.individual-record-accordion,
    .private-panel.student-schedule-accordion,
    .comments-card.individual-comments-accordion { padding: 0; }
    .student-schedule-accordion { margin-top: 0; }
    .student-schedule-accordion .student-schedule-grid { margin-top: 0; }
    .teacher-sync-note {
      margin: 0 0 14px; padding: 11px 13px; border-radius: 13px;
      background: var(--blue-soft); color: #365f84; font-size: .9rem; font-weight: 800;
    }
    .teacher-group-bar { margin-bottom: 16px; }
    .teacher-group-bar .group-grid { margin-top: 12px; }
    .teacher-student-panel { margin-top: 18px; }
    .teacher-picker-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .teacher-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; text-align: left; background: #fff; color: var(--ink); cursor: pointer; transition: .2s ease; }
    .teacher-card:hover, .teacher-card.active { border-color: var(--accent); box-shadow: 0 8px 20px rgba(42, 87, 124, .12); background: #f7fbff; }
    .teacher-card strong, .teacher-card span { display: block; }
    .teacher-card span { margin-top: 4px; color: var(--muted); font-size: .83rem; line-height: 1.45; }
    .export-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .range-export-panel { margin-top: 14px; border: 1px solid #cbded8; border-radius: 15px; padding: 14px; background: #f7fbfa; }
    .range-export-panel h3 { margin: 0; color: var(--primary); font-size: 1rem; }
    .range-export-panel p { margin: 5px 0 11px; color: var(--muted); font-size: .84rem; }
    .range-export-grid { display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)); gap: 10px; }
    .assignment-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .assignment-card { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: #fbfdff; }
    .assignment-card strong { display: block; margin-bottom: 8px; }
    .assignment-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .assignment-options label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: .86rem; }
    .reference-schedule { overflow-x: auto; }
    .reference-schedule table { width: 100%; min-width: 680px; border-collapse: collapse; margin-top: 12px; font-size: .88rem; }
    .reference-schedule th, .reference-schedule td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
    .reference-schedule th { color: var(--muted); font-weight: 700; white-space: nowrap; }
    .teacher-record-heading { margin: 12px 0 7px; padding-top: 9px; border-top: 1px dashed var(--line); color: var(--primary); font-size: .95rem; }
    .performance-sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .performance-group { margin-top: 10px; border: 1px solid #dce6e2; border-radius: 12px; padding: 11px; background: #fbfdfc; }
    .performance-group:first-of-type { margin-top: 0; }
    .performance-sections .performance-group { min-width: 0; margin-top: 0; }
    .performance-group-title { margin-bottom: 8px; color: var(--primary); font-size: .88rem; font-weight: 900; }
    .record-note-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    .visibility-toggle { display: inline-flex; align-items: center; gap: 7px; margin-top: 7px; color: #365f84; font-size: .84rem; font-weight: 900; }
    .visibility-toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
    .homework-label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .quick-homework { position: relative; }
    .quick-homework > summary, .quick-homework-settings > summary { cursor: pointer; list-style: none; color: #365f84; font-weight: 900; }
    .quick-homework > summary { border: 1px solid #b9d0e2; border-radius: 10px; padding: 6px 10px; background: #f3f8fc; font-size: .82rem; white-space: nowrap; }
    .quick-homework > summary::-webkit-details-marker, .quick-homework-settings > summary::-webkit-details-marker { display: none; }
    .quick-homework-menu { margin-top: 8px; border: 1px solid #c9dce9; border-radius: 12px; padding: 10px; background: #f8fbfe; }
    .quick-homework-items { display: flex; gap: 7px; flex-wrap: wrap; }
    .quick-homework-item { border: 1px solid #aac6da; border-radius: 999px; padding: 6px 10px; background: white; color: #2f5d7e; font-weight: 800; cursor: pointer; }
    .quick-homework-item:hover { background: #eaf4fb; }
    .quick-homework-settings { margin-top: 10px; border-top: 1px dashed #b9d0df; padding-top: 9px; }
    .quick-homework-settings .textarea { min-height: 92px; margin-top: 8px; }
    .timetable-grid { display: grid; grid-template-columns: repeat(5, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
    .timetable-day { min-width: 170px; border: 1px solid var(--line); border-radius: 14px; background: #f8fbfa; padding: 10px; }
    .timetable-day h3 { margin: 0 0 9px; font-size: .98rem; color: var(--primary); }
    .schedule-entry { width: 100%; border: 1px solid #d8e1dd; border-radius: 11px; background: white; padding: 9px 10px; margin-top: 8px; text-align: left; color: var(--ink); cursor: pointer; }
    .schedule-entry:first-of-type { margin-top: 0; }
    .schedule-entry:hover, .schedule-entry.active { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 5px 14px rgba(52, 83, 71, .1); }
    .schedule-entry strong, .schedule-entry span { display: block; }
    .schedule-entry span { margin-top: 3px; color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .schedule-empty { color: var(--muted); font-size: .82rem; padding: 12px 3px; }
    .selected-class-banner { margin: 12px 0 14px; border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--accent-soft); }
    .selected-class-banner strong, .selected-class-banner span { display: block; }
    .selected-class-banner span { margin-top: 4px; color: var(--muted); font-size: .86rem; }
    .student-schedule-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .student-schedule-day { border: 1px solid var(--line); border-radius: 12px; padding: 11px; background: #fbfdfc; min-height: 100px; }
    .student-schedule-day h3 { margin: 0 0 8px; font-size: .94rem; color: var(--primary); }
    .student-schedule-item { border-top: 1px dashed var(--line); padding-top: 7px; margin-top: 7px; font-size: .84rem; line-height: 1.45; }
    .student-schedule-item:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
    .private-section-title { margin: 18px 0 10px; font-size: 1.16rem; }

    .day-tabs { margin: 0 0 16px; }
    .day-tab {
      flex: 1 1 104px; border: 1px solid var(--line); background: rgba(255,255,255,.72);
      border-radius: 14px; padding: 9px 12px; text-align: center; font-weight: 800;
    }
    .day-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .day-tab span { display: block; font-size: .78rem; font-weight: 600; opacity: .78; }

    .days-grid { display: grid; gap: 16px; }
    .days-grid.week-view { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .day-card {
      background: var(--paper); border: 1px solid rgba(148, 164, 158, .32);
      border-radius: var(--radius); box-shadow: 0 8px 25px rgba(56, 75, 69, .07);
      overflow: hidden;
    }
    .day-card.wide { grid-column: 1 / -1; }
    .day-card.is-disabled { opacity: .66; }
    .day-header {
      padding: 15px 18px; background: linear-gradient(90deg, #edf7f4, #fff9ed);
      border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .day-header h2 { margin: 0; font-size: 1.25rem; }
    .day-header .date { color: var(--muted); font-weight: 700; font-size: .9rem; }
    .day-body { padding: 17px; display: grid; gap: 14px; }

    .section {
      border: 1px solid var(--line); border-radius: 16px; padding: 14px;
      background: rgba(255,255,255,.78);
    }
    .section.general { border-left: 5px solid #6ca5d7; }
    .section.special { border-left: 5px solid #9e79c8; }
    .section.common { border-left: 5px solid #e4a35f; }
    .section h3 { margin: 0 0 10px; font-size: 1.02rem; display: flex; align-items: center; gap: 7px; }
    .subsection { padding: 10px 0; border-top: 1px dashed #d8dfdc; }
    .subsection:first-of-type { border-top: 0; padding-top: 0; }
    .label { font-size: .82rem; color: var(--muted); font-weight: 800; margin-bottom: 3px; }
    .value { white-space: pre-wrap; overflow-wrap: anywhere; }
    .value.empty { color: #9aa4a1; font-style: italic; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .field { display: grid; gap: 6px; }
    .field > label, .field-label { font-size: .88rem; font-weight: 800; color: #40504c; }
    .input, .textarea, .select {
      width: 100%; border: 1px solid #cbd5d1; background: white; color: var(--ink);
      border-radius: 11px; padding: 10px 11px; outline: none;
    }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(50,123,107,.12); }
    .textarea { min-height: 76px; resize: vertical; }
    .textarea.large { min-height: 112px; }

    .chip-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px;
      background: var(--primary-soft); color: #275e52; border-radius: 999px; font-size: .84rem; font-weight: 800;
    }
    .pill.blue { background: var(--blue-soft); color: #365f84; }
    .pill.orange { background: var(--accent-soft); color: #86501f; }
    .pill.gray { background: #eff1f0; color: #58625f; }
    .check-chip { position: relative; display: inline-flex; }
    .check-chip input { position: absolute; opacity: 0; pointer-events: none; }
    .check-chip span {
      display: inline-flex; align-items: center; min-height: 36px; padding: 7px 10px;
      border: 1px solid #cbd5d1; border-radius: 10px; background: white; font-size: .88rem; font-weight: 700;
    }
    .check-chip input:checked + span { background: var(--primary-soft); color: #235e50; border-color: #85b8aa; }
    .check-chip input:checked + span::before { content: '✓'; margin-right: 5px; font-weight: 900; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; }
    .toggle input { width: 20px; height: 20px; accent-color: var(--primary); }

    .comments-card {
      margin-top: 18px; background: var(--paper); border: 1px solid rgba(148,164,158,.32);
      border-radius: var(--radius); padding: 18px; box-shadow: 0 8px 25px rgba(56,75,69,.07);
    }
    .comments-card h2 { margin: 0 0 14px; font-size: 1.2rem; }
    .comment-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .comment-box { border: 1px solid var(--line); border-radius: 14px; padding: 13px; min-height: 112px; background: white; }
    .comment-box h3 { margin: 0 0 7px; font-size: .95rem; }
    .feedback-form { margin-top: 14px; border: 1px solid #b9d4cc; border-radius: 16px; padding: 15px; background: #f5fbf9; }
    .feedback-form h3 { margin: 0; font-size: 1.05rem; color: var(--primary); }
    .feedback-form p { margin: 5px 0 12px; color: var(--muted); font-size: .88rem; }

    function getPeriodOption(slot) {
      return PERIOD_OPTIONS.find(option => option.value !== 'custom' && option.value === String(slot || '')) || null;
    }

    function normalizeScheduleColor(value) {
      const requested = String(value || 'green');
      return SCHEDULE_COLOR_OPTIONS.some(option => option.value === requested) ? requested : 'green';
    }

    function getScheduleToneClass(entry) {
      return `schedule-tone-${normalizeScheduleColor(entry && entry.color)}`;
    }

    function isCombinedThirdFourthSlot(slot) {
      return String(slot || '').replace(/\s/g, '').replace(/,/g, '、') === '第3、4節';
    }

    function getBlockedScheduleLabel(day, slot) {
      const dayNumber = Number(day);
      if (slot === '午餐') return '午餐';
      if (dayNumber === 1 && slot === '早自修') return '教師晨會';
      if (dayNumber === 2 && ['午休', '第 5 節', '第 6 節', '第 7 節'].includes(slot)) return '教師進修';
      return '';
    }

    function isScheduleBlocked(day, slot) {
      return Boolean(getBlockedScheduleLabel(day, slot));
    }

    function courseTypeToScope(courseType) {
      if (courseType === '國語') return 'chinese';
      if (courseType === '數學') return 'math';
      return 'special';
    }

    function parseLegacySubject(subject, fallbackScope = 'special') {
      const text = String(subject || '').trim();
      const matchedType = COURSE_TYPE_OPTIONS.find(type => text === type || text.startsWith(type + '（') || text.startsWith(type + '('));
      const bracket = text.match(/[（(]\s*([^）)]+)\s*[）)]/);
      const fallbackType = fallbackScope === 'chinese' ? '國語' : fallbackScope === 'math' ? '數學' : '學習策略';
      return {
        courseType: matchedType || (text && !bracket ? text : fallbackType),
        groupToken: bracket ? bracket[1].trim() : ''
      };
    }

    function normalizeComparableValues(values) {
      return (Array.isArray(values) ? values : []).map(value => String(value || '').trim()).filter(Boolean).sort().join('|');
    }

    function inferLegacyGroupId(raw, courseType, studentGroups, roster) {
      if (raw.groupId && studentGroups.some(group => group.id === raw.groupId)) return raw.groupId;
      const selectedNames = normalizeComparableValues(raw.students || []);
      if (selectedNames) {
        const nameById = new Map((roster || []).map(student => [student.id, student.name]));
        const exact = studentGroups.find(group => normalizeComparableValues((group.studentIds || []).map(id => nameById.get(id))) === selectedNames && String(group.name || '').includes(courseType));
        if (exact) return exact.id;
      }
      const token = parseLegacySubject(raw.subject, raw.scope).groupToken.toLowerCase();
      if (!token) return '';
      const matched = studentGroups.find(group => {
        const compactName = String(group.name || '').toLowerCase().replace(String(courseType || '').toLowerCase(), '').replace(/組/g, '').replace(/\s/g, '');
        return compactName === token.replace(/\s/g, '');
      });
      return matched ? matched.id : '';
    }

    function getEntryCourseType(entry) {
      if (!entry) return '';
      if (entry.courseType === 'custom') return String(entry.customCourseType || '').trim() || '自訂課程';
      if (COURSE_TYPE_OPTIONS.includes(entry.courseType)) return entry.courseType;
      return parseLegacySubject(entry.subject, entry.scope).courseType;
    }

    function getEntryGroupLabel(entry, config = state.appConfig) {
      if (!entry) return '';
      const groups = config && Array.isArray(config.studentGroups) ? config.studentGroups : [];
      const matched = groups.find(group => group.id === entry.groupId);
      if (matched) return String(matched.name || '').trim();
      if (entry.groupId === 'custom' || entry.customGroup) return String(entry.customGroup || '').trim();
      const token = parseLegacySubject(entry.subject, entry.scope).groupToken;
      return token ? `${token} 組` : '';
    }

    function getScheduleDisplayTitle(entry, config = state.appConfig) {
      const courseType = getEntryCourseType(entry);
      const group = getEntryGroupLabel(entry, config);
      const conciseGroup = courseType && group.startsWith(courseType) ? group.slice(courseType.length).trim() : group;
      return [courseType, conciseGroup].filter(Boolean).join('・') || '未命名課程';
    }

    function createDefaultAppConfig() {
      return {
        version: 6,
        updatedAt: '',
        terms: [{ id:'115-1', schoolYear:115, semester:1, startDate:DEFAULT_TERM_START, weekCount:DEFAULT_TERM_WEEK_COUNT }],

    function termIdFor(schoolYear, semester) {
      return `${Number(schoolYear) || 115}-${Number(semester) === 2 ? 2 : 1}`;
    }

    function termLabel(term) {
      if (!term) return '未設定學期';
      return `${term.schoolYear} 學年度${Number(term.semester) === 2 ? '下學期' : '上學期'}`;

    function schoolYearDateRange(schoolYear) {
      const westernYear = Number(schoolYear) + 1911;
      return { start:`${westernYear}-08-01`, end:`${westernYear + 1}-07-31` };

    function normalizeScheduleEntries(entries, teacherId, studentGroups = [], roster = []) {
      const expanded = [];
      (Array.isArray(entries) ? entries : []).forEach((entry, sourceIndex) => {
        const raw = entry && typeof entry === 'object' ? entry : {};
        if (isCombinedThirdFourthSlot(raw.slot)) {
          expanded.push({ raw:{ ...raw, slot:'第 3 節', time:'10：30－11：10' }, sourceIndex, fromCombined:true, combinedPart:'p3' });
          expanded.push({ raw:{ ...raw, slot:'第 4 節', time:'11：20－12：00' }, sourceIndex, fromCombined:true, combinedPart:'p4' });
        } else {
          expanded.push({ raw, sourceIndex, fromCombined:false, combinedPart:'' });
        }
      });
      const normalized = expanded.map(({ raw, sourceIndex, fromCombined, combinedPart }) => {
        const legacy = parseLegacySubject(raw.subject, raw.scope);
        const requestedType = String(raw.courseType || legacy.courseType || '').trim();
        const courseType = COURSE_TYPE_OPTIONS.includes(requestedType) ? requestedType : 'custom';
        const customCourseType = courseType === 'custom'
          ? String(raw.customCourseType || (requestedType === 'custom' ? '' : requestedType) || '').trim()
          : '';
        const scope = courseTypeToScope(courseType === 'custom' ? customCourseType : courseType);
        const inferredGroupId = inferLegacyGroupId(raw, courseType === 'custom' ? customCourseType : courseType, studentGroups, roster);
        const groupId = raw.groupId === 'custom' ? 'custom' : inferredGroupId;
        const customGroup = groupId === 'custom'
          ? String(raw.customGroup || legacy.groupToken || '').trim()
          : (!groupId && legacy.groupToken ? `${legacy.groupToken} 組` : String(raw.customGroup || '').trim());
        const baseId = String(raw.id || `schedule-${teacherId}-${Date.now()}-${sourceIndex}`).replace(/\./g, '-');
        const id = combinedPart === 'p4' ? `${baseId}-p4` : baseId;
        const day = Math.min(4, Math.max(0, Number(raw.day) || 0));
        const slot = String(raw.slot || '自訂節次');
        const period = getPeriodOption(slot);
        return {
          id,
          teacherId,
          day,
          slot,
          time: period ? period.time : String(raw.time || ''),
          subject: String(raw.subject || getScopeLabel(scope)),
          courseType,
          customCourseType,
          groupId: groupId || (customGroup ? 'custom' : ''),
          customGroup,
          scope,
          color: normalizeScheduleColor(raw.color),
          students: uniqueValues(Array.isArray(raw.students) ? raw.students : []),
          _fromCombined: fromCombined
        };
      }).filter(entry => !isScheduleBlocked(entry.day, entry.slot));
      const byCell = new Map();
      normalized.forEach(entry => {
        const key = `${entry.day}|${entry.slot}`;
        const existing = byCell.get(key);
        if (!existing || (existing._fromCombined && !entry._fromCombined)) byCell.set(key, entry);
      });
      return Array.from(byCell.values()).map(({ _fromCombined, ...entry }) => entry);
    }

    function normalizeAppConfig(input) {
      const defaults = createDefaultAppConfig();
      const source = input && typeof input === 'object' && !Array.isArray(input) ? input : {};
      const rawTerms = Array.isArray(source.terms) && source.terms.length ? source.terms : defaults.terms;
      const seenTerms = new Set();
      const terms = rawTerms.map(raw => {
        const schoolYear = Math.min(999, Math.max(1, Number(raw && raw.schoolYear) || 115));
        const semester = Number(raw && raw.semester) === 2 ? 2 : 1;
        const id = termIdFor(schoolYear, semester);
        if (seenTerms.has(id)) return null;
        seenTerms.add(id);
        return {
          id,
          schoolYear,
          semester,
          startDate: weekStartMonday((raw && raw.startDate) || DEFAULT_TERM_START),
          weekCount: Math.min(30, Math.max(1, Number(raw && raw.weekCount) || DEFAULT_TERM_WEEK_COUNT))
        };
      }).filter(Boolean).sort((a,b) => a.startDate.localeCompare(b.startDate));
      if (!terms.length) terms.push(...defaults.terms);

      const rawStudents = Array.isArray(source.students) && source.students.length ? source.students : defaults.students;
      const seenStudents = new Set();
      const students = rawStudents.map((raw, index) => {
        const student = raw && typeof raw === 'object' ? raw : {};
        const id = String(student.id || `student-${Date.now()}-${index}`).replace(/\./g, '-');
        if (seenStudents.has(id)) return null;
        seenStudents.add(id);
        return {
          id,
          name: String(student.name || `個案 ${index + 1}`).trim(),
          password: String(student.password == null ? '' : student.password),
          active: student.active !== false
        };
      }).filter(Boolean);

      const rawStudentGroups = Array.isArray(source.studentGroups) ? source.studentGroups : defaults.studentGroups;
      const validStudentIds = new Set(students.map(student => student.id));
      const seenGroups = new Set();
      const studentGroups = rawStudentGroups.map((raw, index) => {
        const group = raw && typeof raw === 'object' ? raw : {};
        const id = String(group.id || `student-group-${Date.now()}-${index}`).replace(/\./g, '-');
        if (seenGroups.has(id)) return null;
        seenGroups.add(id);
        return {
          id,
          name: String(group.name || `新組別 ${index + 1}`).trim(),
          studentIds: uniqueValues(Array.isArray(group.studentIds) ? group.studentIds : []).filter(studentId => validStudentIds.has(studentId))
        };
      }).filter(Boolean);

      const schedules = {};
      const sourceSchedules = source.schedules && typeof source.schedules === 'object' ? source.schedules : {};
      terms.forEach(term => {
        schedules[term.id] = {};
        TEACHERS.forEach(teacher => {
          const termSource = sourceSchedules[term.id] && typeof sourceSchedules[term.id] === 'object' ? sourceSchedules[term.id] : {};
          const fallback = term.id === '115-1' && teacher.id === 'mary' ? defaults.schedules['115-1'].mary : [];
          schedules[term.id][teacher.id] = normalizeScheduleEntries(
            Array.isArray(termSource[teacher.id]) ? termSource[teacher.id] : fallback,
            teacher.id,
            studentGroups,
            students
          );
        });
      });
      return { version:6, updatedAt:String(source.updatedAt || ''), terms, students, studentGroups, schedules };
    }

    function loadAppConfig() {
      try {
        const raw = window.localStorage.getItem(APP_CONFIG_STORAGE_KEY);
        return normalizeAppConfig(raw ? JSON.parse(raw) : null);
      } catch (error) {
        return createDefaultAppConfig();
      }
    }

    function persistAppConfig() {
      try {
        const value = firebaseReady ? sanitizeAppConfigForPublic(state.appConfig) : state.appConfig;
        window.localStorage.setItem(APP_CONFIG_STORAGE_KEY, JSON.stringify(value));
      } catch (error) { /* 使用週資料繼續運作 */ }
    }

    function getTerms() {
      return state.appConfig && Array.isArray(state.appConfig.terms) ? state.appConfig.terms : createDefaultAppConfig().terms;
    }

    function getActiveTerm() {
      const terms = getTerms();
      return terms.find(term => term.id === state.termId) || terms[0];
    }

    function getTermById(termId) {
      return getTerms().find(term => term.id === termId) || null;
    }

    function findTermForWeek(weekStart) {
      const value = weekStartMonday(weekStart);
      return getTerms().find(term => value >= term.startDate && value <= addDaysISO(term.startDate, (term.weekCount - 1) * 7)) || null;
    }

    function chooseInitialTermId() {
      const today = toISO(new Date());
      const terms = getTerms();
      const current = terms.find(term => today >= term.startDate && today <= addDaysISO(term.startDate, (term.weekCount - 1) * 7 + 4));
      if (current) return current.id;
      return (terms.find(term => today < term.startDate) || terms[terms.length - 1] || {}).id || '115-1';
    }

    function getStudentRoster(includeInactive = false) {
      const students = state.appConfig && Array.isArray(state.appConfig.students) ? state.appConfig.students : createDefaultAppConfig().students;
      return students.filter(student => includeInactive || student.active !== false);
    }

    function getTimetable(termId = state.termId, teacherId = '') {
      const schedules = state.appConfig && state.appConfig.schedules && state.appConfig.schedules[termId] || {};
      const groups = state.appConfig && Array.isArray(state.appConfig.studentGroups) ? state.appConfig.studentGroups : [];
      const roster = state.appConfig && Array.isArray(state.appConfig.students) ? state.appConfig.students : [];
      const entries = TEACHERS.flatMap(teacher => normalizeScheduleEntries(schedules[teacher.id] || [], teacher.id, groups, roster));
      return teacherId ? entries.filter(entry => entry.teacherId === teacherId) : entries;
    }

    const state = {

      individualPassword: '',

    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      cacheElements();
      state.appConfig = loadAppConfig();

      state.quickHomeworkItems = loadQuickHomeworkItems();

      await initializeFirebaseClient();
      await loadWeek(state.weekStart, true);

    function cacheElements() {
      [
        'appTitle','hero','content','dayTabs','individualsPageBtn','teacherPageBtn','termSelect','weekSelect','prevWeekBtn','nextWeekBtn','thisWeekBtn',
        'weekViewBtn','dayViewBtn','editBtn','leaveEditBtn','savingBar','dirtyText',

        'passwordTitle','passwordHint','closeModalBtn','loginBtn','exportCenterBtn','settingsCenterBtn',
        'utilityModal','utilityEyebrow','utilityTitle','utilityContent','closeUtilityBtn','toast'
      ].forEach(id => els[id] = document.getElementById(id));
    }

    function bindStaticEvents() {
      els.prevWeekBtn.addEventListener('click', () => navigateWeek(-7));
      els.nextWeekBtn.addEventListener('click', () => navigateWeek(7));
      els.thisWeekBtn.addEventListener('click', () => loadWeek(initialWeekStart()));
      els.termSelect.addEventListener('change', event => switchTerm(event.target.value));
      els.weekSelect.addEventListener('change', event => loadWeek(event.target.value));
      els.weekViewBtn.addEventListener('click', () => setViewMode('week'));
      els.dayViewBtn.addEventListener('click', () => setViewMode('day'));
      els.individualsPageBtn.addEventListener('click', () => setPageMode('individuals'));
      els.teacherPageBtn.addEventListener('click', () => setPageMode('teacher'));
      els.editBtn.addEventListener('click', () => setPageMode('teacher'));
      els.leaveEditBtn.addEventListener('click', leaveEditing);
      els.exportCenterBtn.addEventListener('click', () => openUtility('export'));
      els.settingsCenterBtn.addEventListener('click', () => openUtility('settings'));
      els.closeUtilityBtn.addEventListener('click', closeUtility);
      els.utilityModal.addEventListener('click', event => {
        if (event.target === els.utilityModal) closeUtility();
      });
      els.cancelBtn.addEventListener('click', cancelChanges);
      els.saveBtn.addEventListener('click', saveCurrentWeek);
      els.closeModalBtn.addEventListener('click', closePasswordModal);
      els.passwordModal.addEventListener('click', event => {
        if (event.target === els.passwordModal) closePasswordModal();
      });
      els.passwordToggle.addEventListener('click', () => {
        const showing = els.passwordInput.type === 'text';
        els.passwordInput.type = showing ? 'password' : 'text';
        els.passwordToggle.textContent = showing ? '顯示' : '隱藏';
      });
      els.passwordForm.addEventListener('submit', handleLogin);
      window.addEventListener('beforeunload', event => {
        if (!state.dirty && !state.feedbackDirty && !state.commentEdit && !state.settingsDirty) return;
        event.preventDefault();
        event.returnValue = '';
      });
    }

    function adoptAppConfig(input) {
      if (!input || typeof input !== 'object' || Array.isArray(input)) return false;
      const incoming = normalizeAppConfig(input);
      const currentStamp = String(state.appConfig && state.appConfig.updatedAt || '');
      const incomingStamp = String(incoming.updatedAt || '');
      if (currentStamp && (!incomingStamp || currentStamp > incomingStamp)) return false;
      state.appConfig = incoming;
      persistAppConfig();
      return true;
    }

    async function discoverSharedAppConfig(data, weeks) {
      if (data && data.appConfig && adoptAppConfig(data.appConfig)) return;
      const candidates = (Array.isArray(weeks) ? [...weeks] : [])
        .filter(item => item && item.weekStart && item.weekStart !== (data && data.weekStart))
        .sort((a,b) => String(b.weekStart).localeCompare(String(a.weekStart)))
        .slice(0, 24);
      for (const item of candidates) {
        try {
          const candidate = await callBackend('getWeekData', item.weekStart);
          if (candidate && candidate.appConfig && adoptAppConfig(candidate.appConfig)) return;
        } catch (error) { /* 找不到共用設定時沿用本機設定 */ }
      }
    }

    async function loadWeek(weekStart, bootstrap = false) {
      const hasUnsaved = state.dirty || state.feedbackDirty || Boolean(state.commentEdit) || state.settingsDirty;
      if (hasUnsaved && !confirm('目前有尚未儲存的修改，確定要離開嗎？')) return;
      if (hasUnsaved && state.originalConfig) state.appConfig = deepClone(state.originalConfig);
      state.settingsDirty = false;
      const keepTeacherEditing = state.editing;
      setLoading(true);
      try {
        const result = bootstrap
          ? await callBackend('getBootstrap', weekStart)
          : await callBackend('getWeekData', weekStart);

        if (bootstrap) {
          state.appTitle = '安東潛能班線上聯絡簿';
          state.weeks = Array.isArray(result.weeks) ? result.weeks : [];
          state.storageMode = result.storageMode || state.storageMode;
          await discoverSharedAppConfig(result.data, state.weeks);
          state.data = normalizeClientData(result.data, result.weekStart || weekStart);
        } else {
          if (result && result.appConfig) adoptAppConfig(result.appConfig);
          state.data = normalizeClientData(result, weekStart);
          state.weeks = await callBackend('listWeeks');
        }

        state.weekStart = state.data.weekStart;
        const matchingTerm = findTermForWeek(state.weekStart);
        if (matchingTerm) state.termId = matchingTerm.id;
        if (!getTermById(state.settingsTermId)) state.settingsTermId = state.termId;
        state.data.appConfig = deepClone(state.appConfig);
        state.exportStartDate = state.weekStart;
        state.exportEndDate = addDaysISO(state.weekStart, 4);
        state.originalData = deepClone(state.data);
        state.originalConfig = deepClone(state.appConfig);
        state.dirty = false;
        state.feedbackDirty = false;
        state.feedbackDraft = '';
        state.commentEdit = null;
        state.loading = false;
        if (!keepTeacherEditing) state.editing = false;
        renderAll();
      } catch (error) {
        console.error(error);
        state.loading = false;
        els.content.innerHTML = '<div class="empty-state">讀取失敗：' + escapeHtml(error.message || String(error)) + '</div>';
        showToast('讀取資料失敗', true);
      }
    }

    async function navigateWeek(days) {
      const date = parseISO(state.weekStart);
      date.setDate(date.getDate() + days);
      const target = toISO(date);
      const term = getActiveTerm();
      const first = term.startDate;
      const last = getTermWeeks(term)[term.weekCount - 1].weekStart;
      if (target < first || target > last) {
        showToast(`${termLabel(term)}設定為第 1 週至第 ${term.weekCount} 週`, true);
        return;
      }
      await loadWeek(target);
    }

    async function switchTerm(termId) {
      const term = getTermById(termId);
      if (!term) return;
      state.termId = term.id;
      state.settingsTermId = term.id;
      state.selectedScheduleId = (getTimetable(term.id, state.teacherId)[0] || {}).id || '';
      state.selectedIndividualId = '';
      state.unlockedIndividualId = '';
      state.exportStartDate = term.startDate;
      state.exportEndDate = getTermEndDate(term);
      await loadWeek(initialWeekStart(term));
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      renderAll();
    }

    function renderAll() {
      els.appTitle.textContent = state.appTitle;
      renderHero();
      renderPageTabs();
      renderTermSelect();
      renderWeekSelect();
      renderViewControls();
      renderDayTabs();
      renderContent();
      renderEditingControls();
    }

    async function setPageMode(mode) {
      if (mode === 'groups') mode = 'individuals';
      if (mode === 'individuals' && !state.editing) {
        if ((state.feedbackDirty || state.commentEdit) && !confirm('導師或家長留言尚未儲存，確定返回個案名單嗎？')) return;
        const hadIndividualSession = Boolean(state.unlockedIndividualId);
        state.unlockedIndividualId = '';
        state.individualPassword = '';
        state.individualRole = 'viewer';
        state.feedbackDirty = false;
        state.feedbackDraft = '';
        state.commentEdit = null;
        state.pageMode = 'individuals';
        if (hadIndividualSession && firebaseReady) {
          await firebaseSignOutToPublic();
          return;
        }
      }
      if (mode === 'teacher' && !state.editing) {
        if ((state.feedbackDirty || state.commentEdit) && !confirm('導師或家長留言尚未儲存，確定離開個案頁嗎？')) return;
        state.individualPassword = '';
        state.individualRole = 'viewer';
        state.feedbackDirty = false;
        state.feedbackDraft = '';
        state.commentEdit = null;
        state.pageMode = 'teacher';
        renderAll();
        openPasswordModal('teacher');
        return;
      }
      state.pageMode = mode;
      renderAll();
    }

    function renderPageTabs() {
      const individualsOpen = Boolean(state.unlockedIndividualId);
      const teacherOpen = state.editing && state.pageMode === 'teacher';
      els.individualsPageBtn.classList.toggle('active', state.pageMode === 'individuals');
      els.teacherPageBtn.classList.toggle('active', state.pageMode === 'teacher');
      els.individualsPageBtn.textContent = individualsOpen ? '🔓 學生聯絡簿（已開啟）' : '學生聯絡簿';
      els.teacherPageBtn.textContent = teacherOpen ? '✏️ 教師填寫（編輯中）' : '🔐 教師填寫';
    }

    function getGroups() {
      const source = Array.isArray(state.data && state.data.groups) && state.data.groups.length
        ? state.data.groups
        : DEFAULT_GROUPS;
      return source.map((item, index) => {
        const raw = item && typeof item === 'object' ? item : {};
        const id = String(raw.id || 'group-' + (index + 1));
        const text = (id + ' ' + String(raw.name || '')).toLowerCase();
        const inferredScope = text.includes('國語') || text.includes('chinese') ? 'chinese'
          : text.includes('數學') || text.includes('math') ? 'math'
          : text.includes('特殊') || text.includes('special') ? 'special' : 'all';
        const scope = ['all', 'chinese', 'math', 'special'].includes(raw.scope) ? raw.scope : inferredScope;
        return {
          id,
          name: String(raw.name || '未命名組別'),
          description: String(raw.description || '查看本組本週課程內容。'),
          scope
        };
      });
    }

              <option value="year" ${state.exportPeriodMode === 'year' ? 'selected' : ''}>${selectedTerm.schoolYear} 學年度（上、下學期）</option>

            </select></label>

          </div>

          <div class="utility-actions">

          </div>
          <div class="format-note">不再提供 JSON 檔案。輸出內容包含課程、個案學習紀錄、每日功課、觀察備註與師長留言。</div>
        </section>`;
      document.getElementById('exportTermId').addEventListener('change', event => {

        updateExportRangeForMode();

        state.exportPeriodMode = event.target.value;

      document.getElementById('exportEndDate').addEventListener('change', event => { state.exportEndDate = event.target.value; });

    function getValidatedExportRange() {
      const start = String(state.exportStartDate || '').trim();
      const end = String(state.exportEndDate || start).trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(start) || !/^\d{4}-\d{2}-\d{2}$/.test(end)) {
        showToast('請選擇開始與結束日期', true);
        return null;
      }
      if (start > end) {
        showToast('結束日期不可早於開始日期', true);
        return null;
      }
      return { start, end };
    }

    async function collectSavedWeeksForRange(start, end) {
      const starts = uniqueValues((state.weeks || []).map(item => item.weekStart)
        .concat(state.weekStart >= weekStartMonday(start) && state.weekStart <= weekStartMonday(end) ? [state.weekStart] : []))
        .filter(weekStart => weekStart >= weekStartMonday(start) && weekStart <= weekStartMonday(end))
        .sort();
      const weeks = [];
      for (const weekStart of starts) {
        const raw = weekStart === state.weekStart ? state.data : await callBackend('getWeekData', weekStart);
        const data = normalizeClientData(raw, weekStart);
        const term = findTermForWeek(weekStart);
        data.days = (data.days || []).filter(day => day.date >= start && day.date <= end);
        weeks.push({ weekStart, weekNumber:getTermWeekNumber(weekStart, term || getActiveTerm()), term, data });
      }
      return weeks;
    }

    function getCourseSummary(courseSet, scope) {
      const course = courseSet && courseSet[scope] || {};
      if (scope === 'chinese') return {
        content: [course.lesson, ...(course.topics || []), course.other].filter(Boolean).join('、'),
        homework: course.homework || ''
      };
      if (scope === 'math') return { content:[course.unit, course.content].filter(Boolean).join('・'), homework:course.homework || '' };
      return { content:course.content || '', homework:course.homework || '' };
    }

    function buildHumanReportRows(weeks, studentId) {
      const rows = [];
      const add = (week, date, weekday, type, teacher, target, field, content) => {
        const text = String(content == null ? '' : content).trim();
        if (!text) return;
        rows.push({ term:termLabel(week.term), week:`第 ${week.weekNumber || '-'} 週`, date, weekday, type, teacher, target, field, content:text });
      };
      weeks.forEach(week => {
        const data = week.data || {};
        const selectedPeople = studentId === 'all'
          ? (data.individuals || [])
          : (data.individuals || []).filter(person => person.id === studentId);
        const selectedNames = new Set(selectedPeople.map(person => person.name));
        add(week, week.weekStart, '整週', '本週公告', '', '全班', '公告', data.notice || '');
        (data.days || []).forEach(day => {
          const dayIndex = Math.max(0, (parseISO(day.date).getDay() + 6) % 7);
          const weekday = weekdayName(dayIndex);
          add(week, day.date, weekday, '日期備註', '', '全班', '國定假日／停課', day.holidayNote || '');
          const timetable = getTimetable(week.term ? week.term.id : state.termId).filter(entry => entry.day === dayIndex);
          timetable.filter(entry => studentId === 'all' || (entry.students || []).some(name => selectedNames.has(name))).forEach(entry => {
            const teacher = getTeacher(entry.teacherId);
            const target = `${entry.slot}・${getScheduleDisplayTitle(entry)}`;
            add(week, day.date, weekday, '課表', teacher.name, target, '節次與學生', `${entry.time}${entry.time ? '｜' : ''}${(entry.students || []).join('、')}`);
            const courseSet = day.scheduleCourses && day.scheduleCourses[entry.id]
              ? day.scheduleCourses[entry.id]
              : getTeacherCourseSet(day, entry.teacherId);
            const summary = getCourseSummary(courseSet, entry.scope);
            add(week, day.date, weekday, '課程內容', teacher.name, target, '教學內容', summary.content);
            add(week, day.date, weekday, '課程內容', teacher.name, target, '課程功課', summary.homework);
          });
          selectedPeople.forEach(person => {
            TEACHERS.forEach(teacher => {
              const record = (person.recordsByTeacher && person.recordsByTeacher[teacher.id] || []).find(item => item.date === day.date) || {};
              add(week, day.date, weekday, '個案紀錄', teacher.name, person.name, '學習表現勾選', (record.performanceTags || []).join('、'));
              add(week, day.date, weekday, '個案紀錄', teacher.name, person.name, '學習表現文字紀錄', record.learning || '');
              add(week, day.date, weekday, '個案紀錄', teacher.name, person.name, '特師觀察備註', record.teacherObservation || '');
            });
          });
        });
        selectedPeople.forEach(person => {
          getIndividualCommentMessages(person, data.comments || {}, { includeDeleted:true }).forEach(message => {
            const history = Array.isArray(message.history) && message.history.length ? message.history : [message];
            history.forEach(event => {
              const messageDate = event.date || message.date || week.weekStart;
              const parsedDate = parseISO(messageDate);
              const dayIndex = Math.max(0, (parsedDate.getDay() + 6) % 7);
              const timeLabel = event.createdAt ? formatCommentTimestamp(event) : '既有留言';
              const actionLabel = getCommentActionLabel(event.action, event.legacy);
              const content = event.action === 'delete'
                ? `已刪除留言；刪除前內容：${event.previousContent || message.content || ''}`
                : event.content;
              add(
                week,
                messageDate,
                event.date ? weekdayName(dayIndex) : '整週',
                '師長留言異動',
                message.author || getCommentRoleLabel(message.role),
                person.name,
                `${getCommentRoleLabel(message.role)}｜${actionLabel}｜${timeLabel}`,
                content
              );
            });
          });
        });
      });
      return rows;
    }

    function buildReportDocument(weeks, range, studentId, autoPdf = false) {
      const rows = buildHumanReportRows(weeks, studentId);
      const student = getStudentRoster(true).find(item => item.id === studentId);
      const target = student ? student.name : '全部學生與課程';
      const bodyRows = rows.length ? rows.map(row => `<tr><td>${escapeHtml(row.term)}</td><td>${escapeHtml(row.week)}</td><td>${escapeHtml(row.date)}<br>${escapeHtml(row.weekday)}</td><td>${escapeHtml(row.type)}</td><td>${escapeHtml(row.teacher)}</td><td>${escapeHtml(row.target)}</td><td>${escapeHtml(row.field)}</td><td>${escapeHtml(row.content)}</td></tr>`).join('') : '<tr><td colspan="8">所選期間尚無已儲存內容。</td></tr>';
      return `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>安東潛能班紀錄</title><style>
        @page{size:A4 landscape;margin:12mm}body{font-family:"Microsoft JhengHei",sans-serif;color:#222;font-size:10.5pt}h1{margin:0 0 6px;color:#246455}p{margin:3px 0 12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #888;padding:5px;vertical-align:top;white-space:pre-wrap}th{background:#e2f1ed}tr{page-break-inside:avoid}.meta{color:#555}
      </style></head><body><h1>安東潛能班線上聯絡簿紀錄</h1><p class="meta">輸出對象：${escapeHtml(target)}｜日期：${escapeHtml(range.start)} 至 ${escapeHtml(range.end)}｜製作時間：${escapeHtml(new Date().toLocaleString('zh-TW'))}</p><table><thead><tr><th>學期</th><th>週次</th><th>日期</th><th>類型</th><th>教師</th><th>課程／個案</th><th>欄位</th><th>內容</th></tr></thead><tbody>${bodyRows}</tbody></table>${autoPdf ? '<script>window.addEventListener("load",()=>setTimeout(()=>window.print(),250));<\/script>' : ''}</body></html>`;
    }

    function safeFilename(value) {
      return String(value || '').replace(/[\\/:*?"<>|]/g, '_');
    }

    async function runHumanExport(format) {
      if (state.dirty || state.settingsDirty) {
        showToast('請先儲存目前修改，再輸出資料', true);
        return;
      }
      const range = getValidatedExportRange();
      if (!range) return;
      const button = document.getElementById(format === 'pdf' ? 'downloadPdfBtn' : 'downloadWordBtn');
      const original = button ? button.textContent : '';
      if (button) { button.disabled = true; button.textContent = '整理資料中…'; }
      try {
        const weeks = await collectSavedWeeksForRange(range.start, range.end);
        const student = getStudentRoster(true).find(item => item.id === state.exportStudentId);
        const filename = safeFilename(`安東潛能班_${student ? student.name : '全部紀錄'}_${range.start}_${range.end}`);
        if (format === 'word') {
          downloadText(filename + '.doc', '\uFEFF' + buildReportDocument(weeks, range, state.exportStudentId, false), 'application/msword;charset=utf-8');
          showToast('Word 紀錄已下載');
        } else {
          const reportWindow = window.open('', '_blank');
          if (!reportWindow) throw new Error('瀏覽器封鎖了 PDF 視窗，請允許彈出式視窗後再試。');
          reportWindow.document.open();
          reportWindow.document.write(buildReportDocument(weeks, range, state.exportStudentId, true));
          reportWindow.document.close();
          showToast('已開啟 PDF 儲存視窗');
        }
      } catch (error) {
        console.error(error);
        showToast(error.message || '輸出失敗', true);
      } finally {
        if (button) { button.disabled = false; button.textContent = original; }
      }
    }

      const draft = state.settingsDraft || state.appConfig;
      return (draft.terms || []).find(term => term.id === state.settingsTermId) || (draft.terms || [])[0] || null;
    }

    function getSettingsSchedule(teacherId = state.settingsTeacherId) {
      const draft = state.settingsDraft || state.appConfig;
      if (!draft.schedules || typeof draft.schedules !== 'object') draft.schedules = {};
      if (!draft.schedules[state.settingsTermId]) draft.schedules[state.settingsTermId] = {};
      if (!Array.isArray(draft.schedules[state.settingsTermId][teacherId])) draft.schedules[state.settingsTermId][teacherId] = [];
      return draft.schedules[state.settingsTermId][teacherId];
    }

      const draft = state.settingsDraft || state.appConfig;
      if (!Array.isArray(draft.studentGroups)) draft.studentGroups = [];
      return draft.studentGroups;

      const schedules = getSettingsSchedule();
      let selected = schedules.find(entry => entry.id === state.settingsScheduleId) || schedules[0] || null;
      state.settingsScheduleId = selected ? selected.id : '';
      return selected;

      return (state.settingsOpenSections || []).includes(sectionId);
    }

    function createSettingsScheduleEntry(day = 0, slot = '第 1 節', time = '') {
      const period = getPeriodOption(slot);
      return {
        id: `schedule-${state.settingsTeacherId}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
        teacherId: state.settingsTeacherId,
        day: Number(day) || 0,
        slot: String(slot || '自訂節次'),
        time: period ? period.time : String(time || ''),
        subject: '國語',
        courseType: '國語',
        customCourseType: '',
        groupId: '',
        customGroup: '',
        scope: 'chinese',
        color: 'green',
        students: []
      };
    }

    function getScheduleBoardRows(schedules) {
      const standardRows = PERIOD_OPTIONS.filter(option => option.value !== 'custom');
      const customRows = uniqueValues((schedules || []).map(entry => entry.slot).filter(slot => slot && !getPeriodOption(slot)))
        .map(slot => {
          const matched = schedules.find(entry => entry.slot === slot);
          return { value:slot, label:slot, time:matched ? matched.time : '', custom:true };
        });
      return standardRows.concat(customRows);
    }

    function getStudentGroupNames(group) {
      const draft = state.settingsDraft || state.appConfig;
      const activeById = new Map((draft.students || []).filter(student => student.active !== false).map(student => [student.id, student.name]));
      return uniqueValues((group && group.studentIds || []).map(id => activeById.get(id)).filter(Boolean));
    }

    function renderScheduleBoard(schedules) {
      const rows = getScheduleBoardRows(schedules);
      return `<div class="schedule-board-wrap"><table class="schedule-board">
        <thead><tr><th class="period-heading">節次與時間</th>${[0,1,2,3,4].map(day => `<th>${weekdayName(day)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(period => `<tr>
          <th class="period-heading"><strong>${escapeHtml(period.label)}</strong><span>${escapeHtml(period.time || '自訂時間')}</span></th>

            : [0,1,2,3,4].map(day => {
            if (day === 2 && ['第 5 節', '第 6 節', '第 7 節'].includes(period.value)) return '';

              return '<td rowspan="4"><div class="schedule-board-blocked schedule-board-blocked-tall"><strong>教師進修</strong><span>午休至第 7 節</span></div></td>';
            }
            const entries = schedules.filter(entry => Number(entry.day) === day && entry.slot === period.value);
            const blockedLabel = getBlockedScheduleLabel(day, period.value);
            if (blockedLabel) {
              return `<td><div class="schedule-board-cell"><div class="schedule-board-blocked"><strong>${escapeHtml(blockedLabel)}</strong><span>固定時段</span></div></div></td>`;
            }
            return `<td><div class="schedule-board-cell">${entries.length ? entries.map(entry => `
              <button class="schedule-board-entry ${getScheduleToneClass(entry)} ${entry.id === state.settingsScheduleId ? 'active' : ''}" type="button" data-select-settings-schedule="${escapeAttr(entry.id)}">
                <strong>${escapeHtml(getScheduleDisplayTitle(entry, state.settingsDraft))}</strong>

        </tr>`).join('')}</tbody>

    function renderSelectedScheduleEditor(entry, activeStudents, groups) {

      const knownGroup = groups.find(group => group.id === entry.groupId);

      const scheduleColor = normalizeScheduleColor(entry.color);

          ${periodValue === 'custom' ? `<label class="field"><span class="field-label">自訂節次名稱</span><input class="input" data-selected-schedule-field="slot" value="${escapeAttr(entry.slot)}" placeholder="例如：午間加課"></label>` : ''}
